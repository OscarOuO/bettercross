<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CubeFlow Pro — 3x3 Cross & X-Cross 最佳解分析器</title>
  <style>
    :root {
      --bg: #0b101e;
      --card: #131b2e;
      --card-border: #22304f;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --gold: #f59e0b;
      --green: #10b981;
      --cyan: #06b6d4;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
    .badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      font-weight: 700;
    }
    .tabs { display: flex; gap: 6px; background: #090d16; padding: 4px; border-radius: 10px; border: 1px solid var(--card-border); }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .grid-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 900px) {
      .grid-main { grid-template-columns: 1.05fr 0.95fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
    }
    .panel-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .scramble-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .scramble-input {
      flex: 1;
      min-width: 200px;
      background: #090d16;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.95rem;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:hover { background: #334155; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-gold { background: var(--gold); border-color: var(--gold); color: #090d16; font-weight: 700; }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; border-radius: 7px; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    /* Loading Overlay & Progress Bar */
    .solver-loading {
      background: rgba(9, 13, 22, 0.92);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(59, 130, 246, 0.25);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-track {
      width: 100%;
      max-width: 320px;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      transition: width 0.12s ease-out;
    }

    /* 2D Unfolded Net */
    .painter-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 680px) {
      .painter-wrap { grid-template-columns: auto 240px; align-items: start; }
    }
    .net-container {
      background: #080c17;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }
    .cube-net {
      display: grid;
      grid-template-columns: repeat(12, 24px);
      grid-template-rows: repeat(9, 24px);
      gap: 3px;
    }
    @media (min-width: 480px) {
      .cube-net {
        grid-template-columns: repeat(12, 28px);
        grid-template-rows: repeat(9, 28px);
        gap: 4px;
      }
    }
    .net-cell {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0f172a;
      user-select: none;
    }
    .net-cell.center-lock {
      cursor: not-allowed;
      border: 2px solid rgba(0,0,0,0.65);
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .swatch-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #090d16;
      border: 2px solid var(--card-border);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .swatch-btn.active { border-color: #3b82f6; background: rgba(59,130,246,0.15); }
    .swatch-dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); }

    /* Pure CSS 3D Cube Viewport */
    .viewport-box {
      position: relative;
      height: 245px;
      background: radial-gradient(circle at center, #16223b 0%, #090d16 100%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .viewport-box:active { cursor: grabbing; }
    .scene3d {
      width: 108px;
      height: 108px;
      perspective: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cube3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.08s linear;
    }
    .cubie {
      position: absolute;
      width: 34px;
      height: 34px;
      left: 37px;
      top: 37px;
      transform-style: preserve-3d;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cubie-face {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #0f172a;
      border: 2px solid #090d16;
      border-radius: 5px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: rgba(15, 23, 42, 0.85);
      transition: box-shadow 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .cubie-face.pair-glow {
      border: 2.5px solid #00f5d4 !important;
      box-shadow: 0 0 8px rgba(0, 245, 212, 0.85);
    }
    .face-U { transform: rotateX(90deg) translateZ(17px); }
    .face-D { transform: rotateX(-90deg) translateZ(17px); }
    .face-F { transform: translateZ(17px); }
    .face-B { transform: rotateY(180deg) translateZ(17px); }
    .face-R { transform: rotateY(90deg) translateZ(17px); }
    .face-L { transform: rotateY(-90deg) translateZ(17px); }

    .cam-bar {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: space-between;
      pointer-events: none;
    }
    .cam-bar .btn { pointer-events: auto; background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(4px); }
    .step-banner {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(9, 13, 22, 0.88);
      border: 1px solid var(--card-border);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      pointer-events: none;
    }

    /* Playback Moves */
    .moves-track {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin: 10px 0;
      min-height: 44px;
      align-items: center;
    }
    .move-pill {
      padding: 4px 10px;
      border-radius: 6px;
      background: #1e293b;
      color: #cbd5e1;
      font-family: ui-monospace, monospace;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .move-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: #93c5fd;
      transform: scale(1.05);
    }
    .move-pill.hold-pill {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      font-size: 0.8rem;
    }

    /* Solutions List */
    .sol-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
    }
    .sol-card {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    .sol-card:hover { border-color: #475569; }
    .sol-card.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
    }
    .sol-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .tag-xcross { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .tag-pair { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.45); }
    .tag-split { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.45); }
    .tag-cross { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .hold-badge {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pair-target-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.4);
      margin-top: 4px;
    }
    .mini-dots {
      display: inline-flex;
      gap: 2px;
      align-items: center;
    }
    .mini-dot {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.5);
      display: inline-block;
    }
    .sol-alg { font-family: ui-monospace, monospace; font-size: 1rem; font-weight: 800; color: #fff; margin: 4px 0 2px; }
    .sol-meta { font-size: 0.77rem; color: var(--muted); margin-top: 3px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span>🧊 Better Cross</span>
  </div>
  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabBtnScramble">公式打亂輸入</button>
    <button type="button" class="tab-btn" id="tabBtnPainter">2D 手動塗色輸入</button>
    <button type="button" class="tab-btn" id="btnTimerToggle">⏱️ 15秒預判: <span id="timerText">待機</span></button>
  </div>
</header>

<!-- Mode 1: Scramble Input -->
<section class="panel" id="panelScramble">
  <div class="panel-title">
    <span>WCA 打亂公式輸入（預設白頂 U、綠前 F）</span>
    <span id="scrambleStepCount" style="color:var(--muted);font-size:0.8rem;">0 步</span>
  </div>
  <div class="scramble-box">
    <input type="text" id="scrambleInput" class="scramble-input" value="D' R2 U' F2 D B2 U2 R2 D' F' L D' R U' B' L2" placeholder="輸入打亂公式，例如: R U R' U' ..." />
    <button type="button" class="btn btn-primary" id="btnAnalyzeScramble">⚡ 立即分析最佳解</button>
    <button type="button" class="btn" id="btnRandomScramble">🎲 隨機打亂</button>
    <button type="button" class="btn btn-gold" id="btnDemoXCross">★ 範例：X-Cross 與連塊 Pair</button>
  </div>
  <div class="btn-group">
    <span style="font-size:0.82rem;color:var(--muted);">目標十字底色：</span>
    <button type="button" class="btn btn-sm btn-primary cross-color-btn" data-color="W">⚪ 白底 (White)</button>
    <button type="button" class="btn btn-sm cross-color-btn" data-color="Y">🟡 黃底 (Yellow)</button>
    <button type="button" class="btn btn-sm cross-color-btn" data-color="DUAL">⚪🟡 白黃雙色 (Dual)</button>
  </div>
</section>

<!-- Mode 2: 2D Manual Painter -->
<section class="panel hidden" id="panelPainter">
  <div class="panel-title">
    <span>2D 展開圖手動塗色（點擊格子即時同步下方 3D 魔方）</span>
    <div class="btn-group">
      <button type="button" class="btn btn-sm" id="btnSyncFromScramble">載入目前打亂至塗色盤</button>
      <button type="button" class="btn btn-sm" id="btnResetSolved">重設為已還原</button>
    </div>
  </div>
  <div class="painter-wrap">
    <div class="net-container">
      <div class="cube-net" id="cubeNetGrid"></div>
    </div>
    <div>
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:6px;">選擇畫筆顏色（中心塊固定鎖定）：</div>
      <div class="palette-grid" id="paletteGrid"></div>
      <div id="painterStatus" style="font-size:0.8rem;padding:8px;border-radius:8px;background:#090d16;border:1px solid var(--card-border);margin-bottom:10px;"></div>
      <button type="button" class="btn btn-gold" style="width:100%;" id="btnApplyPainted">套用塗色狀態並分析最佳十字</button>
    </div>
  </div>
</section>

<!-- Main Interactive Workspace -->
<div class="grid-main">
  <!-- Left: Compact 3D Cube & Step Playback -->
  <div class="panel" style="margin-bottom:0;">
    <div class="panel-title">
      <span>3D 魔方同步檢視（青色發光框 = 目標 Pair 方塊）</span>
      <div class="btn-group">
        <button type="button" class="btn btn-sm btn-primary mask-btn" data-mask="full">完整魔方</button>
        <button type="button" class="btn btn-sm mask-btn" data-mask="highlight">十字 + 目標 Pair 高亮</button>
        <button type="button" class="btn btn-sm mask-btn" data-mask="cross">僅顯示十字</button>
      </div>
    </div>

    <div class="viewport-box" id="viewport3d">
      <div class="cam-bar">
        <div class="btn-group">
          <button type="button" class="btn btn-sm" id="camStandard">看白頂綠前 (U/F/R)</button>
          <button type="button" class="btn btn-sm" id="camFaceD">正視 D 面 (對照展開圖 D)</button>
          <button type="button" class="btn btn-sm" id="camFaceF">正視 F 面</button>
        </div>
        <button type="button" class="btn btn-sm" id="btnToggleZ2View">視角：標準 WCA (U=白)</button>
      </div>

      <div class="scene3d">
        <div class="cube3d" id="cube3dRoot"></div>
      </div>

      <div class="step-banner">
        <span id="stepStatusLabel">Step 0：原始打亂起點（與 2D 展開圖 100% 同步）</span>
        <span id="activeSlotLabel" style="color:#22d3ee;font-weight:700;"></span>
      </div>
    </div>

    <div class="moves-track" id="movesTrack"></div>

    <div class="btn-group" style="justify-content:space-between;">
      <div class="btn-group">
        <button type="button" class="btn btn-sm" id="btnStepStart">⏮ 起點 (Step 0)</button>
        <button type="button" class="btn btn-sm" id="btnStepPrev">◀ 上一步</button>
        <button type="button" class="btn btn-sm btn-primary" id="btnStepPlay">▶ 自動播放</button>
        <button type="button" class="btn btn-sm" id="btnStepNext">下一步 ▶</button>
        <button type="button" class="btn btn-sm" id="btnStepEnd">⏭ 完成態</button>
      </div>
      <span id="stepCounterText" style="font-size:0.82rem;color:var(--muted);font-family:monospace;">0 / 0</span>
    </div>
  </div>

  <!-- Right: Ranked Optimal Cross / X-Cross / Free Pair Solutions -->
  <div class="panel" style="margin-bottom:0;">
    <div class="panel-title">
      <span>最佳十字 & X-Cross / 保留 Pair 推薦路線（≤ 8 步）</span>
      <span id="solverPerfText" style="font-size:0.76rem;color:var(--green);">準備就緒</span>
    </div>

    <!-- Asynchronous Progress Overlay -->
    <div class="solver-loading hidden" id="solverLoadingBox">
      <div class="spinner-ring"></div>
      <div style="font-size:0.88rem;font-weight:700;color:#fff;" id="loadingStageTitle">正在分析最佳十字與 F2L Pair...</div>
      <div class="progress-track">
        <div class="progress-fill" id="loadingProgressBar"></div>
      </div>
      <div style="font-size:0.76rem;color:var(--muted);" id="loadingSubText">進度 0%</div>
    </div>

    <div class="sol-list" id="solutionsList"></div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // =========================================================================
  // 1. UNIFIED 3D COORDINATE GEOMETRY ENGINE (Single Source of Truth)
  // =========================================================================
  const FACE_INFO = {
    U: { color: 'W', hex: '#f8fafc', name: '白 (U)', normal: [0, 1, 0] },
    D: { color: 'Y', hex: '#facc15', name: '黃 (D)', normal: [0, -1, 0] },
    F: { color: 'G', hex: '#22c55e', name: '綠 (F)', normal: [0, 0, 1] },
    B: { color: 'B', hex: '#3b82f6', name: '藍 (B)', normal: [0, 0, -1] },
    L: { color: 'O', hex: '#f97316', name: '橘 (L)', normal: [-1, 0, 0] },
    R: { color: 'R', hex: '#ef4444', name: '紅 (R)', normal: [1, 0, 0] }
  };

  const COLOR_HEX = {
    W: '#f8fafc', Y: '#facc15', G: '#22c55e',
    B: '#3b82f6', O: '#f97316', R: '#ef4444'
  };

  const COLOR_NAMES_TW = {
    W: '白', Y: '黃', G: '綠', B: '藍', O: '橘', R: '紅'
  };

  const STICKER_DEFS = [];
  function buildStickerDefs() {
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'U', r, c,
          netRow: r, netCol: 3 + c,
          pos: [c - 1, 1, r - 1], normal: [0, 1, 0], defaultColor: 'W'
        });
      }
    }
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'L', r, c,
          netRow: 3 + r, netCol: c,
          pos: [-1, 1 - r, c - 1], normal: [-1, 0, 0], defaultColor: 'O'
        });
      }
    }
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'F', r, c,
          netRow: 3 + r, netCol: 3 + c,
          pos: [c - 1, 1 - r, 1], normal: [0, 0, 1], defaultColor: 'G'
        });
      }
    }
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'R', r, c,
          netRow: 3 + r, netCol: 6 + c,
          pos: [1, 1 - r, 1 - c], normal: [1, 0, 0], defaultColor: 'R'
        });
      }
    }
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'B', r, c,
          netRow: 3 + r, netCol: 9 + c,
          pos: [1 - c, 1 - r, -1], normal: [0, 0, -1], defaultColor: 'B'
        });
      }
    }
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        STICKER_DEFS.push({
          id: STICKER_DEFS.length, face: 'D', r, c,
          netRow: 6 + r, netCol: 3 + c,
          pos: [c - 1, -1, 1 - r], normal: [0, -1, 0], defaultColor: 'Y'
        });
      }
    }
  }
  buildStickerDefs();

  const COORD_TO_STICKER = new Map();
  STICKER_DEFS.forEach(s => {
    const key = `${s.pos[0]},${s.pos[1]},${s.pos[2]}|${s.normal[0]},${s.normal[1]},${s.normal[2]}`;
    COORD_TO_STICKER.set(key, s.id);
  });

  // Group sticker indices by their cubie coordinate (x,y,z) so we can identify pieces accurately
  const CUBIE_GROUPS = [];
  const cubieMap = new Map();
  STICKER_DEFS.forEach(s => {
    const cKey = `${s.pos[0]},${s.pos[1]},${s.pos[2]}`;
    if (!cubieMap.has(cKey)) {
      const grp = { pos: s.pos, stickerIds: [] };
      cubieMap.set(cKey, grp);
      CUBIE_GROUPS.push(grp);
    }
    cubieMap.get(cKey).stickerIds.push(s.id);
  });

  function rotVec90([x, y, z], axis, dir) {
    if (axis === 'y') return dir === 1 ? [z, y, -x] : [-z, y, x];
    if (axis === 'x') return dir === 1 ? [x, -z, y] : [x, z, -y];
    if (axis === 'z') return dir === 1 ? [-y, x, z] : [y, -x, z];
    return [x, y, z];
  }

  const MOVE_PERMS = {};
  const BASE_MOVES_SPEC = {
    'U': { axis: 'y', layer: [1], dir: -1 },
    'D': { axis: 'y', layer: [-1], dir: 1 },
    'R': { axis: 'x', layer: [1], dir: -1 },
    'L': { axis: 'x', layer: [-1], dir: 1 },
    'F': { axis: 'z', layer: [1], dir: -1 },
    'B': { axis: 'z', layer: [-1], dir: 1 },
    'y': { axis: 'y', layer: [-1, 0, 1], dir: -1 },
    'x': { axis: 'x', layer: [-1, 0, 1], dir: -1 },
    'z': { axis: 'z', layer: [-1, 0, 1], dir: -1 }
  };

  function composePerm(p1, p2) {
    const out = new Uint8Array(54);
    for (let i = 0; i < 54; i++) out[i] = p1[p2[i]];
    return out;
  }

  Object.keys(BASE_MOVES_SPEC).forEach(m => {
    const spec = BASE_MOVES_SPEC[m];
    const axisIdx = spec.axis === 'x' ? 0 : (spec.axis === 'y' ? 1 : 2);
    const perm1 = new Uint8Array(54);
    for (let i = 0; i < 54; i++) {
      const s = STICKER_DEFS[i];
      if (spec.layer.includes(s.pos[axisIdx])) {
        const newPos = rotVec90(s.pos, spec.axis, spec.dir);
        const newNorm = rotVec90(s.normal, spec.axis, spec.dir);
        const destKey = `${newPos[0]},${newPos[1]},${newPos[2]}|${newNorm[0]},${newNorm[1]},${newNorm[2]}`;
        const destIdx = COORD_TO_STICKER.get(destKey);
        perm1[destIdx] = i;
      } else {
        perm1[i] = i;
      }
    }
    const perm2 = composePerm(perm1, perm1);
    const perm3 = composePerm(perm2, perm1);
    MOVE_PERMS[m] = perm1;
    MOVE_PERMS[m + '2'] = perm2;
    MOVE_PERMS[m + "'"] = perm3;
  });

  function createSolvedStickers() {
    return STICKER_DEFS.map(s => s.defaultColor);
  }

  function applyMoveToStickers(stickers, moveStr) {
    const perm = MOVE_PERMS[moveStr];
    if (!perm) return stickers.slice();
    const next = new Array(54);
    for (let i = 0; i < 54; i++) next[i] = stickers[perm[i]];
    return next;
  }

  function parseAlg(str) {
    if (!str || !str.trim()) return [];
    return str.trim().replace(/[\[\]()]/g, ' ').split(/\s+/).filter(t => MOVE_PERMS[t]);
  }

  function applyAlgToStickers(stickers, algStrOrArr) {
    const tokens = Array.isArray(algStrOrArr) ? algStrOrArr : parseAlg(algStrOrArr);
    let cur = stickers.slice();
    for (const m of tokens) cur = applyMoveToStickers(cur, m);
    return cur;
  }

  // =========================================================================
  // 2. PURE CSS 3D CUBE RENDERER
  // =========================================================================
  const cube3dRoot = document.getElementById('cube3dRoot');
  const STICKER_DOM_MAP = new Array(54);

  function initCSS3DCube() {
    cube3dRoot.innerHTML = '';
    const spacing = 35;
    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const cubie = document.createElement('div');
          cubie.className = 'cubie';
          cubie.style.transform = `translate3d(${x * spacing}px, ${-y * spacing}px, ${z * spacing}px)`;

          const faces = [
            { cls: 'face-U', norm: [0, 1, 0] },
            { cls: 'face-D', norm: [0, -1, 0] },
            { cls: 'face-F', norm: [0, 0, 1] },
            { cls: 'face-B', norm: [0, 0, -1] },
            { cls: 'face-R', norm: [1, 0, 0] },
            { cls: 'face-L', norm: [-1, 0, 0] }
          ];

          faces.forEach(f => {
            const fDiv = document.createElement('div');
            fDiv.className = `cubie-face ${f.cls}`;
            const key = `${x},${y},${z}|${f.norm[0]},${f.norm[1]},${f.norm[2]}`;
            if (COORD_TO_STICKER.has(key)) {
              const sIdx = COORD_TO_STICKER.get(key);
              const sDef = STICKER_DEFS[sIdx];
              if (sDef.r === 1 && sDef.c === 1) {
                fDiv.textContent = sDef.face;
              }
              STICKER_DOM_MAP[sIdx] = { el: fDiv, cubiePos: [x, y, z], def: sDef };
            }
            cubie.appendChild(fDiv);
          });

          cube3dRoot.appendChild(cubie);
        }
      }
    }
  }
  initCSS3DCube();

  let camRotX = -24;
  let camRotY = -34;
  let viewZ2Mode = false;

  function updateCameraTransform() {
    const z2Flip = viewZ2Mode ? 'rotateZ(180deg)' : '';
    cube3dRoot.style.transform = `rotateX(${camRotX}deg) rotateY(${camRotY}deg) ${z2Flip}`;
  }
  updateCameraTransform();

  (function setupOrbitDrag() {
    const vp = document.getElementById('viewport3d');
    let dragging = false, lastX = 0, lastY = 0;
    vp.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      vp.setPointerCapture(e.pointerId);
    });
    vp.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      camRotY += dx * 0.55;
      camRotX = Math.max(-88, Math.min(88, camRotX - dy * 0.55));
      updateCameraTransform();
    });
    vp.addEventListener('pointerup', () => { dragging = false; });
    vp.addEventListener('pointercancel', () => { dragging = false; });
  })();

  // =========================================================================
  // 3. FAST IDA* SOLVER WITH PRUNING & F2L PAIR COLOR IDENTIFICATION
  // =========================================================================
  const SOLVER_MOVES = [
    'U', "U'", 'U2',
    'D', "D'", 'D2',
    'R', "R'", 'R2',
    'L', "L'", 'L2',
    'F', "F'", 'F2',
    'B', "B'", 'B2'
  ];
  const SOLVER_MOVE_FACE = SOLVER_MOVES.map(m => m[0]);
  const SOLVER_MOVE_AXIS = SOLVER_MOVES.map(m => {
    const f = m[0];
    if (f === 'U' || f === 'D') return 0;
    if (f === 'R' || f === 'L') return 1;
    return 2;
  });

  // Sticker indices for D-Cross edges: DF, DR, DB, DL
  const CROSS_EDGE_STICKERS = [
    [46, 25], // DF (D center=49, F center=22)
    [50, 34], // DR (D center=49, R center=31)
    [52, 43], // DB (D center=49, B center=40)
    [48, 16]  // DL (D center=49, L center=13)
  ];
  const SIDE_CENTERS = [22, 31, 40, 13]; // F, R, B, L centers

  const F2L_SLOTS = [
    { name: '右前槽 (FR)', shortName: 'FR', corner: [47, 26, 33], edge: [23, 30], cCenters: [49, 22, 31], eCenters: [22, 31] },
    { name: '左前槽 (FL)', shortName: 'FL', corner: [45, 24, 17], edge: [21, 14], cCenters: [49, 22, 13], eCenters: [22, 13] },
    { name: '右後槽 (BR)', shortName: 'BR', corner: [53, 42, 35], edge: [39, 32], cCenters: [49, 40, 31], eCenters: [40, 31] },
    { name: '左後槽 (BL)', shortName: 'BL', corner: [51, 44, 15], edge: [41, 12], cCenters: [49, 40, 13], eCenters: [40, 13] }
  ];

  function countMisplacedCrossEdges(state) {
    const dCol = state[49];
    let bad = 0;
    for (let i = 0; i < 4; i++) {
      const [dIdx, sIdx] = CROSS_EDGE_STICKERS[i];
      if (state[dIdx] !== dCol || state[sIdx] !== state[SIDE_CENTERS[i]]) bad++;
    }
    return bad;
  }

  // Tighter admissible heuristic for D-Cross:
  // Any cross edge sticker currently on U face (indices 0..8) needs at least 1 move to reach D;
  // Also count how many D-layer positions are missing the D color.
  function estimateCrossMinMoves(state, badCount) {
    if (badCount === 0) return 0;
    const dCol = state[49];
    let notInDLayer = 0;
    for (let i = 0; i < 4; i++) {
      const [dIdx] = CROSS_EDGE_STICKERS[i];
      if (state[dIdx] !== dCol) notInDLayer++;
    }
    // One move of F/R/B/L can put at most 1 edge into D layer (2 only if U/D doesn't change D layer count)
    // And 1 move of D can fix up to 4 already-in-D-layer edges.
    if (notInDLayer === 0) return 1; // At least a D turn or flip
    return notInDLayer;
  }

  function isSlotSolved(state, slotIdx) {
    const sl = F2L_SLOTS[slotIdx];
    for (let i = 0; i < 3; i++) {
      if (state[sl.corner[i]] !== state[sl.cCenters[i]]) return false;
    }
    for (let i = 0; i < 2; i++) {
      if (state[sl.edge[i]] !== state[sl.eCenters[i]]) return false;
    }
    return true;
  }

  const PAIR_INSERT_TRIGGERS = [
    { slot: 0, type: 'connected', trig: ['R', 'U', "R'"], label: "R U R'" },
    { slot: 0, type: 'connected', trig: ["F'", "U'", 'F'], label: "F' U' F" },
    { slot: 0, type: 'split',     trig: ['R', "U'", "R'"], label: "R U' R'" },
    { slot: 0, type: 'split',     trig: ["F'", 'U', 'F'], label: "F' U F" },

    { slot: 1, type: 'connected', trig: ["L'", "U'", 'L'], label: "L' U' L" },
    { slot: 1, type: 'connected', trig: ['F', 'U', "F'"], label: "F U F'" },
    { slot: 1, type: 'split',     trig: ["L'", 'U', 'L'], label: "L' U L" },
    { slot: 1, type: 'split',     trig: ['F', "U'", "F'"], label: "F U' F'" },

    { slot: 2, type: 'connected', trig: ["R'", "U'", 'R'], label: "R' U' R" },
    { slot: 2, type: 'split',     trig: ["R'", 'U', 'R'], label: "R' U R" },

    { slot: 3, type: 'connected', trig: ['L', 'U', "L'"], label: "L U L'" },
    { slot: 3, type: 'split',     trig: ['L', "U'", "L'"], label: "L U' L'" }
  ];

  const AUF_LIST = [
    { moves: [], str: '' },
    { moves: ['U'], str: 'U ' },
    { moves: ["U'"], str: "U' " },
    { moves: ['U2'], str: 'U2 ' }
  ];

  // Build human-readable Pair Color description (e.g. "白-綠-紅 Pair [右前 FR 槽]")
  function describePairColors(state, slotIdx) {
    if (slotIdx < 0 || slotIdx > 3) return null;
    const sl = F2L_SLOTS[slotIdx];
    const cCols = sl.cCenters.map(ci => state[ci]); // [D_col, Side1_col, Side2_col]
    const eCols = sl.eCenters.map(ei => state[ei]); // [Side1_col, Side2_col]
    const nameStr = `${COLOR_NAMES_TW[cCols[0]]}-${COLOR_NAMES_TW[cCols[1]]}-${COLOR_NAMES_TW[cCols[2]]} Pair (${sl.name})`;
    return {
      slotIdx,
      slotName: sl.name,
      shortName: sl.shortName,
      cornerColors: cCols,
      edgeColors: eCols,
      text: nameStr
    };
  }

  function evaluatePostCrossPairs(state) {
    for (let s = 0; s < 4; s++) {
      if (isSlotSolved(state, s)) {
        const pairDesc = describePairColors(state, s);
        return {
          tier: 3,
          badge: '🏆 X-Cross 完成',
          tagClass: 'tag-xcross',
          pairDesc,
          continuation: `十字完成同時直接做好【${pairDesc.text}】！`
        };
      }
    }

    let bestSplit = null;
    for (const auf of AUF_LIST) {
      let sAuf = state;
      for (const m of auf.moves) sAuf = applyMoveToStickers(sAuf, m);

      for (const item of PAIR_INSERT_TRIGGERS) {
        let sTest = sAuf;
        for (const m of item.trig) sTest = applyMoveToStickers(sTest, m);

        if (countMisplacedCrossEdges(sTest) === 0 && isSlotSolved(sTest, item.slot)) {
          const contAlg = (auf.str + item.label).trim();
          const pairDesc = describePairColors(state, item.slot);
          if (item.type === 'connected') {
            return {
              tier: 2,
              badge: '⭐ 保留分離 Pair',
              tagClass: 'tag-pair',
              pairDesc,
              continuation: `保留【${pairDesc.text}】→ 接著轉 [${contAlg}] 秒入槽`
            };
          } else if (!bestSplit) {
            bestSplit = {
              tier: 1,
              badge: '⚡ 保留連塊 Pair',
              tagClass: 'tag-split',
              pairDesc,
              continuation: `保留【${pairDesc.text}】→ 接著轉 [${contAlg}] 三步入槽`
            };
          }
        }
      }
    }
    if (bestSplit) return bestSplit;

    return {
      tier: 0,
      badge: '純十字最佳解',
      tagClass: 'tag-cross',
      pairDesc: null,
      continuation: '標準最佳步數十字（無預組好之 3 步內 Pair）'
    };
  }

  function scoreErgonomics(moves) {
    let score = 100;
    for (const m of moves) {
      const f = m[0];
      if (f === 'B') score -= 9;
      else if (f === 'L' || f === 'F') score -= 3;
      else score -= 1;
      if (m.endsWith('2')) score -= 2;
    }
    return Math.max(40, score);
  }

  // Convert whole-cube rotation into intuitive "Which face is on Bottom & Front"
  function getHoldOrientationList(targetMode) {
    const list = [];
    // Standard WCA starts with U=White, D=Yellow, F=Green, R=Red, B=Blue, L=Orange
    if (targetMode === 'W' || targetMode === 'DUAL') {
      list.push({
        rotAlg: ['z2'],
        holdBadge: '⚪ 白底 · 🟩 綠面朝前 (F=綠)',
        shortHold: '白底·綠前 (F=綠)'
      });
      list.push({
        rotAlg: ['z2', 'y'],
        holdBadge: '⚪ 白底 · 🟥 紅面朝前 (F=紅)',
        shortHold: '白底·紅前 (F=紅)'
      });
      list.push({
        rotAlg: ['z2', "y'"],
        holdBadge: '⚪ 白底 · 🟧 橘面朝前 (F=橘)',
        shortHold: '白底·橘前 (F=橘)'
      });
      list.push({
        rotAlg: ['z2', 'y2'],
        holdBadge: '⚪ 白底 · 🟦 藍面朝前 (F=藍)',
        shortHold: '白底·藍前 (F=藍)'
      });
    }
    if (targetMode === 'Y' || targetMode === 'DUAL') {
      list.push({
        rotAlg: [],
        holdBadge: '🟡 黃底 · 🟩 綠面朝前 (F=綠)',
        shortHold: '黃底·綠前 (F=綠)'
      });
      list.push({
        rotAlg: ['y'],
        holdBadge: '🟡 黃底 · 🟥 紅面朝前 (F=紅)',
        shortHold: '黃底·紅前 (F=紅)'
      });
      list.push({
        rotAlg: ["y'"],
        holdBadge: '🟡 黃底 · 🟧 橘面朝前 (F=橘)',
        shortHold: '黃底·橘前 (F=橘)'
      });
      list.push({
        rotAlg: ['y2'],
        holdBadge: '🟡 黃底 · 🟦 藍面朝前 (F=藍)',
        shortHold: '黃底·藍前 (F=藍)'
      });
    }
    return list;
  }

  // Asynchronous Chunked Solver with Real-time Progress Bar
  let activeSearchToken = 0;

  async function findBestSolutionsAsync(baseStickers, targetMode) {
    const myToken = ++activeSearchToken;
    const loadingBox = document.getElementById('solverLoadingBox');
    const progBar = document.getElementById('loadingProgressBar');
    const stageTitle = document.getElementById('loadingStageTitle');
    const subText = document.getElementById('loadingSubText');
    const listEl = document.getElementById('solutionsList');

    loadingBox.classList.remove('hidden');
    listEl.style.opacity = '0.35';
    progBar.style.width = '5%';

    const orientations = getHoldOrientationList(targetMode);
    const candidates = [];
    const t0 = performance.now();

    for (let idx = 0; idx < orientations.length; idx++) {
      if (myToken !== activeSearchToken) return null; // Cancelled by newer search

      const ori = orientations[idx];
      const pct = Math.round(((idx) / orientations.length) * 100);
      progBar.style.width = `${Math.max(8, pct)}%`;
      stageTitle.textContent = `正在計算：${ori.holdBadge}`;
      subText.textContent = `已完成 ${idx} / ${orientations.length} 種拿法角度 (${pct}%)`;

      // Yield to browser UI thread so spinner & progress bar animate smoothly!
      await new Promise(r => setTimeout(r, 12));
      if (myToken !== activeSearchToken) return null;

      const startState = applyAlgToStickers(baseStickers, ori.rotAlg);
      let minDepthFound = -1;
      let solutionsForOri = 0;
      const path = [];

      function dfs(state, depth, maxDepth, lastFace, lastAxis) {
        if (solutionsForOri >= 14) return;
        const bad = countMisplacedCrossEdges(state);
        if (bad === 0) {
          if (minDepthFound === -1) minDepthFound = depth;
          solutionsForOri++;
          const pairInfo = evaluatePostCrossPairs(state);
          const movesCopy = path.slice();
          const ergo = scoreErgonomics(movesCopy);
          candidates.push({
            holdBadge: ori.holdBadge,
            shortHold: ori.shortHold,
            rotAlg: ori.rotAlg,
            moves: movesCopy,
            stepCount: movesCopy.length,
            ergo,
            pairInfo,
            totalRankScore: pairInfo.tier * 250 - movesCopy.length * 25 + ergo
          });
          return;
        }

        const rem = maxDepth - depth;
        if (rem <= 0) return;
        // Admissible pruning bound:
        const minNeeded = estimateCrossMinMoves(state, bad);
        if (minNeeded > rem) return;

        for (let mIdx = 0; mIdx < 18; mIdx++) {
          const face = SOLVER_MOVE_FACE[mIdx];
          const axis = SOLVER_MOVE_AXIS[mIdx];
          if (face === lastFace) continue;
          if (axis === lastAxis && (face === 'D' || face === 'L' || face === 'B')) continue;

          const mv = SOLVER_MOVES[mIdx];
          path.push(mv);
          dfs(applyMoveToStickers(state, mv), depth + 1, maxDepth, face, axis);
          path.pop();
          if (solutionsForOri >= 14) return;
        }
      }

      for (let d = 0; d <= 8; d++) {
        dfs(startState, 0, d, '', -1);
        if (minDepthFound !== -1 && d >= Math.min(8, minDepthFound + 1)) {
          break;
        }
      }
    }

    progBar.style.width = '100%';
    await new Promise(r => setTimeout(r, 40));
    if (myToken !== activeSearchToken) return null;

    loadingBox.classList.add('hidden');
    listEl.style.opacity = '1';

    candidates.sort((a, b) => b.totalRankScore - a.totalRankScore);
    const unique = [];
    const seen = new Set();
    for (const c of candidates) {
      const key = c.holdBadge + ':' + c.moves.join(' ');
      if (!seen.has(key)) {
        seen.add(key);
        unique.push(c);
        if (unique.length >= 12) break;
      }
    }

    const dt = (performance.now() - t0).toFixed(0);
    document.getElementById('solverPerfText').textContent = `搜尋完成 (${dt} ms · 保證 ≤ 8 步)`;
    return unique;
  }

  // =========================================================================
  // 4. APPLICATION STATE & 3D TARGET PAIR GLOW HIGHLIGHTING
  // =========================================================================
  let currentBaseStickers = createSolvedStickers();
  let paintedStickers = createSolvedStickers();
  let activeBrushColor = 'W';
  let targetCrossMode = 'W';
  let maskMode = 'full';

  let currentSolutions = [];
  let selectedSolution = null;
  let playbackTimeline = [];
  let currentStepIdx = 0;
  let playInterval = null;

  // Check if a cubie (by its sticker colors in `stickers54`) is one of the 2 pieces of `pairDesc`
  function isCubiePartOfTargetPair(cubieStickerIds, stickers54, pairDesc) {
    if (!pairDesc) return false;
    const cols = cubieStickerIds.map(id => stickers54[id]).sort().join('');
    if (cubieStickerIds.length === 3) {
      const targetCorner = pairDesc.cornerColors.slice().sort().join('');
      return cols === targetCorner;
    }
    if (cubieStickerIds.length === 2) {
      const targetEdge = pairDesc.edgeColors.slice().sort().join('');
      return cols === targetEdge;
    }
    return false;
  }

  function isCubiePartOfTargetCross(cubieStickerIds, stickers54, targetDColor) {
    if (cubieStickerIds.length !== 2) return false;
    return cubieStickerIds.some(id => stickers54[id] === targetDColor);
  }

  function render3DStickers(stickers54, pairDesc = null, targetDColor = 'W') {
    // Classify each of the 26 outer cubies
    CUBIE_GROUPS.forEach(grp => {
      const isCenter = (grp.stickerIds.length === 1);
      const isPairPiece = isCubiePartOfTargetPair(grp.stickerIds, stickers54, pairDesc);
      const isCrossPiece = isCubiePartOfTargetCross(grp.stickerIds, stickers54, targetDColor);

      grp.stickerIds.forEach(sIdx => {
        const dom = STICKER_DOM_MAP[sIdx];
        if (!dom) return;
        const colCode = stickers54[sIdx];
        const hex = COLOR_HEX[colCode] || '#334155';

        let dim = false;
        if (maskMode === 'cross') {
          if (!isCenter && !isCrossPiece) dim = true;
        } else if (maskMode === 'highlight') {
          if (!isCenter && !isCrossPiece && !isPairPiece) dim = true;
        }

        dom.el.style.background = dim ? '#1e293b' : hex;
        dom.el.style.opacity = dim ? '0.32' : '1';
        dom.el.classList.toggle('pair-glow', isPairPiece && !dim);
      });
    });
  }

  // Build 2D Unfolded Net DOM
  const cubeNetGrid = document.getElementById('cubeNetGrid');
  const NET_DOM_CELLS = new Array(54);

  function init2DNetDOM() {
    cubeNetGrid.innerHTML = '';
    const gridMap = new Map();
    STICKER_DEFS.forEach(s => {
      gridMap.set(`${s.netRow},${s.netCol}`, s);
    });

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 12; c++) {
        const key = `${r},${c}`;
        if (!gridMap.has(key)) {
          const empty = document.createElement('div');
          cubeNetGrid.appendChild(empty);
          continue;
        }
        const sDef = gridMap.get(key);
        const cell = document.createElement('div');
        cell.className = 'net-cell';
        const isCenter = (sDef.r === 1 && sDef.c === 1);
        if (isCenter) {
          cell.classList.add('center-lock');
          cell.textContent = sDef.face;
        }
        cell.addEventListener('click', () => {
          if (isCenter) return;
          paintedStickers[sDef.id] = activeBrushColor;
          currentBaseStickers = paintedStickers.slice();
          update2DNetUI();
          render3DStickers(currentBaseStickers);
          document.getElementById('stepStatusLabel').textContent = '即時預覽：2D 手動塗色狀態（與展開圖 100% 同步）';
        });
        NET_DOM_CELLS[sDef.id] = cell;
        cubeNetGrid.appendChild(cell);
      }
    }
  }
  init2DNetDOM();

  function initPaletteDOM() {
    const pal = document.getElementById('paletteGrid');
    pal.innerHTML = '';
    Object.keys(FACE_INFO).forEach(fKey => {
      const info = FACE_INFO[fKey];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch-btn' + (info.color === activeBrushColor ? ' active' : '');
      btn.innerHTML = `<span class="swatch-dot" style="background:${info.hex}"></span><span>${info.name}</span>`;
      btn.addEventListener('click', () => {
        activeBrushColor = info.color;
        initPaletteDOM();
      });
      pal.appendChild(btn);
    });
  }
  initPaletteDOM();

  function update2DNetUI() {
    const counts = { W: 0, Y: 0, G: 0, B: 0, O: 0, R: 0 };
    for (let i = 0; i < 54; i++) {
      const col = paintedStickers[i];
      counts[col] = (counts[col] || 0) + 1;
      if (NET_DOM_CELLS[i]) {
        NET_DOM_CELLS[i].style.background = COLOR_HEX[col];
      }
    }
    const statusEl = document.getElementById('painterStatus');
    const allNine = Object.keys(counts).every(k => counts[k] === 9);
    if (allNine) {
      statusEl.innerHTML = `<span style="color:var(--green);font-weight:700;">✔ 54 張貼紙數量正確（6 色各 9 張），已同步至下方 3D 魔方！</span>`;
    } else {
      const summary = Object.entries(counts).map(([k, v]) => `${k}:${v}`).join(' · ');
      statusEl.innerHTML = `<span style="color:var(--gold);">目前貼紙統計 (${summary}) — 請確保每色各 9 張後點擊分析</span>`;
    }
  }

  function selectSolution(solIdx) {
    stopAutoPlay();
    selectedSolution = currentSolutions[solIdx];
    document.querySelectorAll('.sol-card').forEach((el, i) => {
      el.classList.toggle('selected', i === solIdx);
    });

    if (!selectedSolution) return;

    playbackTimeline = [];
    let curState = currentBaseStickers.slice();
    playbackTimeline.push({
      label: '起點 (標準白頂綠前)',
      isHold: false,
      state: curState.slice(),
      desc: 'Step 0：原始打亂起點（與 2D 展開圖 100% 同步）'
    });

    if (selectedSolution.rotAlg.length > 0) {
      curState = applyAlgToStickers(curState, selectedSolution.rotAlg);
      playbackTimeline.push({
        label: `拿法：${selectedSolution.shortHold}`,
        isHold: true,
        state: curState.slice(),
        desc: `預判擺放：${selectedSolution.holdBadge}`
      });
    }

    selectedSolution.moves.forEach((mv, idx) => {
      curState = applyMoveToStickers(curState, mv);
      playbackTimeline.push({
        label: mv,
        isHold: false,
        state: curState.slice(),
        desc: `第 ${idx + 1} 步：執行 ${mv} （${selectedSolution.shortHold}）`
      });
    });

    const pDesc = selectedSolution.pairInfo.pairDesc;
    document.getElementById('activeSlotLabel').textContent = pDesc
      ? `目標 Pair：${pDesc.text}`
      : selectedSolution.pairInfo.badge;

    const track = document.getElementById('movesTrack');
    track.innerHTML = '';
    playbackTimeline.forEach((step, idx) => {
      const pill = document.createElement('span');
      pill.className = 'move-pill' + (step.isHold ? ' hold-pill' : '');
      pill.textContent = step.label;
      pill.addEventListener('click', () => goToStep(idx));
      track.appendChild(pill);
    });

    goToStep(0);
  }

  function goToStep(idx) {
    if (!playbackTimeline.length) return;
    currentStepIdx = Math.max(0, Math.min(playbackTimeline.length - 1, idx));
    const step = playbackTimeline[currentStepIdx];
    const targetCol = (selectedSolution && selectedSolution.holdBadge.includes('黃底')) ? 'Y' : 'W';
    const pairDesc = selectedSolution ? selectedSolution.pairInfo.pairDesc : null;

    render3DStickers(step.state, pairDesc, targetCol);

    document.getElementById('stepStatusLabel').textContent = step.desc;
    document.getElementById('stepCounterText').textContent = `${currentStepIdx} / ${playbackTimeline.length - 1}`;

    const pills = document.querySelectorAll('#movesTrack .move-pill');
    pills.forEach((p, i) => p.classList.toggle('active', i === currentStepIdx));
  }

  function stopAutoPlay() {
    if (playInterval) {
      clearInterval(playInterval);
      playInterval = null;
      document.getElementById('btnStepPlay').textContent = '▶ 自動播放';
    }
  }

  function buildPairBadgeHTML(pairDesc) {
    if (!pairDesc) return '';
    const dotsHtml = pairDesc.cornerColors
      .map(c => `<span class="mini-dot" style="background:${COLOR_HEX[c]}"></span>`)
      .join('');
    return `
      <div class="pair-target-pill">
        <span class="mini-dots">${dotsHtml}</span>
        <span>目標組 Pair：${pairDesc.text}</span>
      </div>
    `;
  }

  function renderSolutionsList() {
    const listEl = document.getElementById('solutionsList');
    listEl.innerHTML = '';
    if (!currentSolutions || !currentSolutions.length) {
      listEl.innerHTML = `<div style="color:var(--muted);padding:12px;">找不到解法，請檢查魔方貼紙狀態是否正確。</div>`;
      return;
    }

    currentSolutions.forEach((sol, idx) => {
      const card = document.createElement('div');
      card.className = 'sol-card' + (idx === 0 ? ' selected' : '');
      const movesStr = sol.moves.length ? sol.moves.join(' ') : '(已還原)';
      const pairPillHtml = buildPairBadgeHTML(sol.pairInfo.pairDesc);

      card.innerHTML = `
        <div class="sol-top">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="tag ${sol.pairInfo.tagClass}">${sol.pairInfo.badge}</span>
            <span class="hold-badge">🧭 ${sol.holdBadge}</span>
          </div>
          <span style="font-size:0.78rem;font-weight:700;color:#93c5fd;">${sol.stepCount} 步 · 順手度 ${sol.ergo}</span>
        </div>
        <div class="sol-alg">${movesStr}</div>
        ${pairPillHtml}
        <div class="sol-meta">${sol.pairInfo.continuation}</div>
      `;
      card.addEventListener('click', () => selectSolution(idx));
      listEl.appendChild(card);
    });

    selectSolution(0);
  }

  async function runScrambleAnalysis() {
    const raw = document.getElementById('scrambleInput').value;
    const tokens = parseAlg(raw);
    document.getElementById('scrambleStepCount').textContent = `${tokens.length} 步`;
    currentBaseStickers = applyAlgToStickers(createSolvedStickers(), tokens);
    paintedStickers = currentBaseStickers.slice();
    update2DNetUI();
    render3DStickers(currentBaseStickers);

    const res = await findBestSolutionsAsync(currentBaseStickers, targetCrossMode);
    if (res) {
      currentSolutions = res;
      renderSolutionsList();
    }
  }

  // =========================================================================
  // 5. EVENT LISTENERS
  // =========================================================================
  document.getElementById('tabBtnScramble').addEventListener('click', () => {
    document.getElementById('tabBtnScramble').classList.add('active');
    document.getElementById('tabBtnPainter').classList.remove('active');
    document.getElementById('panelScramble').classList.remove('hidden');
    document.getElementById('panelPainter').classList.add('hidden');
  });

  document.getElementById('tabBtnPainter').addEventListener('click', () => {
    document.getElementById('tabBtnPainter').classList.add('active');
    document.getElementById('tabBtnScramble').classList.remove('active');
    document.getElementById('panelPainter').classList.remove('hidden');
    document.getElementById('panelScramble').classList.add('hidden');
    update2DNetUI();
    goToStep(0);
  });

  document.getElementById('btnAnalyzeScramble').addEventListener('click', runScrambleAnalysis);

  document.getElementById('btnRandomScramble').addEventListener('click', () => {
    const faces = ['U', 'D', 'R', 'L', 'F', 'B'];
    const mods = ['', "'", '2'];
    const out = [];
    let last = '';
    for (let i = 0; i < 18; i++) {
      let f = faces[Math.floor(Math.random() * faces.length)];
      while (f === last) f = faces[Math.floor(Math.random() * faces.length)];
      last = f;
      out.push(f + mods[Math.floor(Math.random() * mods.length)]);
    }
    document.getElementById('scrambleInput').value = out.join(' ');
    runScrambleAnalysis();
  });

  document.getElementById('btnDemoXCross').addEventListener('click', () => {
    document.getElementById('scrambleInput').value = "z2 R U' R' D' F' R' D2 z2";
    runScrambleAnalysis();
  });

  document.querySelectorAll('.cross-color-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.cross-color-btn').forEach(b => b.classList.remove('btn-primary'));
      btn.classList.add('btn-primary');
      targetCrossMode = btn.getAttribute('data-color');
      const res = await findBestSolutionsAsync(currentBaseStickers, targetCrossMode);
      if (res) {
        currentSolutions = res;
        renderSolutionsList();
      }
    });
  });

  document.querySelectorAll('.mask-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mask-btn').forEach(b => b.classList.remove('btn-primary'));
      btn.classList.add('btn-primary');
      maskMode = btn.getAttribute('data-mask');
      goToStep(currentStepIdx);
    });
  });

  document.getElementById('btnSyncFromScramble').addEventListener('click', () => {
    const tokens = parseAlg(document.getElementById('scrambleInput').value);
    paintedStickers = applyAlgToStickers(createSolvedStickers(), tokens);
    currentBaseStickers = paintedStickers.slice();
    update2DNetUI();
    goToStep(0);
  });

  document.getElementById('btnResetSolved').addEventListener('click', async () => {
    paintedStickers = createSolvedStickers();
    currentBaseStickers = paintedStickers.slice();
    update2DNetUI();
    const res = await findBestSolutionsAsync(currentBaseStickers, targetCrossMode);
    if (res) {
      currentSolutions = res;
      renderSolutionsList();
    }
  });

  document.getElementById('btnApplyPainted').addEventListener('click', async () => {
    currentBaseStickers = paintedStickers.slice();
    const res = await findBestSolutionsAsync(currentBaseStickers, targetCrossMode);
    if (res) {
      currentSolutions = res;
      renderSolutionsList();
    }
  });

  // Camera Presets
  document.getElementById('camStandard').addEventListener('click', () => {
    viewZ2Mode = false;
    camRotX = -24;
    camRotY = -34;
    document.getElementById('btnToggleZ2View').textContent = '視角：標準 WCA (U=白)';
    updateCameraTransform();
  });

  document.getElementById('camFaceD').addEventListener('click', () => {
    viewZ2Mode = false;
    camRotX = 88;
    camRotY = 0;
    updateCameraTransform();
  });

  document.getElementById('camFaceF').addEventListener('click', () => {
    viewZ2Mode = false;
    camRotX = 0;
    camRotY = 0;
    updateCameraTransform();
  });

  document.getElementById('btnToggleZ2View').addEventListener('click', () => {
    viewZ2Mode = !viewZ2Mode;
    document.getElementById('btnToggleZ2View').textContent = viewZ2Mode ? '視角：z2 翻轉 (D面朝上)' : '視角：標準 WCA (U=白)';
    updateCameraTransform();
  });

  // Playback buttons
  document.getElementById('btnStepStart').addEventListener('click', () => { stopAutoPlay(); goToStep(0); });
  document.getElementById('btnStepPrev').addEventListener('click', () => { stopAutoPlay(); goToStep(currentStepIdx - 1); });
  document.getElementById('btnStepNext').addEventListener('click', () => { stopAutoPlay(); goToStep(currentStepIdx + 1); });
  document.getElementById('btnStepEnd').addEventListener('click', () => { stopAutoPlay(); goToStep(playbackTimeline.length - 1); });

  document.getElementById('btnStepPlay').addEventListener('click', () => {
    if (playInterval) {
      stopAutoPlay();
      return;
    }
    if (currentStepIdx >= playbackTimeline.length - 1) goToStep(0);
    document.getElementById('btnStepPlay').textContent = '⏸ 暫停';
    playInterval = setInterval(() => {
      if (currentStepIdx < playbackTimeline.length - 1) {
        goToStep(currentStepIdx + 1);
      } else {
        stopAutoPlay();
      }
    }, 650);
  });

  // 15s WCA Inspection Timer
  let timerId = null;
  let timeLeft = 15;
  document.getElementById('btnTimerToggle').addEventListener('click', () => {
    const txt = document.getElementById('timerText');
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      txt.textContent = '待機';
      return;
    }
    timeLeft = 15;
    txt.textContent = `${timeLeft}s`;
    timerId = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        txt.textContent = `${timeLeft}s`;
      } else {
        clearInterval(timerId);
        timerId = null;
        txt.textContent = '時間到!';
      }
    }, 1000);
  });

  // Initial Boot
  runScrambleAnalysis();
})();
</script>
</body>
</html>
