        const isDone = appState.currentStep > stepNum;
        let phaseClass = 'bg-slate-900 text-slate-200 border-slate-800 hover:border-slate-600';
        if (m.phase === 'setup') phaseClass = 'bg-slate-900 phase-setup hover:border-sky-400';
        else if (m.phase === 'insert') phaseClass = 'bg-slate-900 phase-insert hover:border-emerald-400';

        btn.className = `move-pill px-2 py-0.5 rounded text-[11px] font-mono-alg border ${
          isCurrent
            ? 'active-move'
            : isDone
            ? 'done-move'
            : phaseClass
        }`;
        btn.textContent = m.raw;
        btn.onclick = () => { pausePlayback(); snapThreeCubeToStep(stepNum); };
        container.appendChild(btn);
      });
    }

    function startPlayback() {
      clearTimeout(loopTimeoutId);
      if (appState.parsedMoves.length === 0) return;
      if (appState.currentStep >= appState.parsedMoves.length) snapThreeCubeToStep(0);
      appState.isPlaying = true;
      updatePlayButtonUI();
      playNextStepInSequence();
    }

    function pausePlayback() {
      clearTimeout(loopTimeoutId);
      appState.isPlaying = false;
      updatePlayButtonUI();
    }

    function playNextStepInSequence() {
      if (!appState.isPlaying) return;
      if (appState.currentStep >= appState.parsedMoves.length) {
        if (appState.autoLoop) {
          loopTimeoutId = setTimeout(() => {
            if (!appState.isPlaying) return;
            snapThreeCubeToStep(0);
            loopTimeoutId = setTimeout(() => {
              if (appState.isPlaying) playNextStepInSequence();
            }, 400);
          }, 600);
        } else {
          appState.isPlaying = false;
          updatePlayButtonUI();
        }
        return;
      }

      const nextMove = appState.parsedMoves[appState.currentStep];
      appState.currentStep += 1;
      updateTimelineUI();

      animateSingleMove(nextMove, () => {
        if (appState.isPlaying) playNextStepInSequence();
      });
    }

    function stepForward() {
      pausePlayback();
      if (currentTween) finishCurrentTweenInstantly();
      if (appState.currentStep < appState.parsedMoves.length) {
        const move = appState.parsedMoves[appState.currentStep];
        appState.currentStep += 1;
        updateTimelineUI();
        animateSingleMove(move, null);
      }
    }

    function stepBackward() {
      pausePlayback();
      if (currentTween) finishCurrentTweenInstantly();
      if (appState.currentStep > 0) {
        const move = invertMove(appState.parsedMoves[appState.currentStep - 1]);
        appState.currentStep -= 1;
        updateTimelineUI();
        animateSingleMove(move, null);
      }
    }

    function updatePlayButtonUI() {
      const label = document.getElementById('label-play-pause');
      label.textContent = appState.isPlaying ? '暫停' : '播放';
    }

    /*************************************************************************
     * 7. RENDER UNIFIED F2L LIBRARY (ALL 95 CASES IN ONE PLACE)
     *************************************************************************/
    function formatAlgWithBracketsHTML(algStr) {
      return algStr
        .replace(/\(([^)]+)\)/g, '<span class="text-sky-300">($1)</span>')
        .replace(/\[([^\]]+)\]/g, '<span class="text-emerald-300 font-semibold">[$1]</span>');
    }

    function renderCategoryFilterBar() {
      const bar = document.getElementById('category-filter-bar');
      if (!bar) return;
      bar.innerHTML = '';
      F2L_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        const active = appState.selectedCategory === cat.id;
        let styleClass = 'text-slate-400 hover:text-slate-200';
        if (active) {
          styleClass = cat.isWrongSlot
            ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
            : 'bg-sky-500/20 text-sky-300 border border-sky-500/40';
        } else if (cat.isWrongSlot) {
          styleClass = 'text-amber-400/80 hover:text-amber-300';
        }
        btn.className = `px-2 py-0.5 rounded text-[11px] font-medium transition ${styleClass}`;
        btn.textContent = cat.short;
        btn.onclick = () => {
          appState.selectedCategory = cat.id;
          renderCategoryFilterBar();
          renderCasesList();
        };
        bar.appendChild(btn);
      });
    }

    function renderCasesList() {
      const container = document.getElementById('cases-list-container');
      if (!container) return;
      container.innerHTML = '';

      const q = appState.searchQuery.trim().toLowerCase();
      const categoriesToRender = F2L_CATEGORIES.filter(
        c => c.id !== 'ALL' && (appState.selectedCategory === 'ALL' || appState.selectedCategory === c.id)
      );

      categoriesToRender.forEach(cat => {
        const casesInCat = UNIFIED_F2L_CASES.filter(c => {
          if (c.cat !== cat.id) return false;
          if (!q) return true;
          const matchMeta =
            c.title.toLowerCase().includes(q) ||
            c.displayNum.toLowerCase().includes(q) ||
            (c.subCode && c.subCode.toLowerCase().includes(q)) ||
            (c.tags && c.tags.some(t => t.toLowerCase().includes(q)));
          const allAlgs = ['FR', 'BR', 'FL', 'BL']
            .flatMap(s => c.slots[s].map(x => `${x.alg} ${x.badge || ''}`))
            .join(' ')
            .toLowerCase();
          return matchMeta || allAlgs.includes(q);
        });

        if (casesInCat.length === 0) return;

        const section = document.createElement('section');
        section.className = 'flex flex-col gap-2.5';

        const secHeader = document.createElement('h3');
        secHeader.className = `text-xs font-bold uppercase tracking-wider border-b border-slate-800/80 pb-1.5 ${
          cat.isWrongSlot ? 'text-amber-400' : 'text-slate-400'
        }`;
        secHeader.textContent = cat.name;
        section.appendChild(secHeader);

        if (appState.viewMode === 'single') {
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-3.5';

          casesInCat.forEach(caseItem => {
            const slotKey = appState.selectedSlot;
            const algObjs = caseItem.slots[slotKey] || [];
            const primaryAlg = algObjs[0] ? algObjs[0].alg : '';
            const frPrimaryAlg = (caseItem.slots.FR && caseItem.slots.FR[0]) ? caseItem.slots.FR[0].alg : primaryAlg;
            const isCardActive = appState.activeCaseId === caseItem.id && appState.activeAlgSlot === slotKey;

            const card = document.createElement('div');
            card.dataset.caseId = caseItem.id;
            card.className = `case-card rounded-xl p-4 flex flex-col gap-3 ${isCardActive ? 'active-card' : ''}`;

            // Top Header with Large 110x110 FR Standard Reference Diagram + Title
            const topHeader = document.createElement('div');
            topHeader.className = 'flex items-center justify-between gap-3 pb-2.5 border-b border-slate-800/80';

            const topHeaderLeft = document.createElement('div');
            topHeaderLeft.className = 'flex items-center gap-3 min-w-0';

            const frRefBox = document.createElement('div');
            frRefBox.className = 'relative shrink-0 rounded-xl bg-slate-950 border border-emerald-500/40 p-1 cursor-pointer hover:border-emerald-400 transition shadow-md';
            frRefBox.title = 'FR 基準對照示意圖 (點擊直接播放 FR 解法)';
            const frRefCanvas = document.createElement('canvas');
            frRefCanvas.className = 'w-[110px] h-[110px] block';
            renderCubeThumbnail(frRefCanvas, frPrimaryAlg, appState.maskMode, 'FR', caseItem.id, caseItem.wrongRel, 110);
            const frRefBadge = document.createElement('span');
            frRefBadge.className = 'absolute bottom-1 right-1 px-1.5 py-0.2 rounded bg-emerald-500/90 text-slate-950 font-extrabold text-[9px]';
            frRefBadge.textContent = 'FR 基準圖';
            frRefBox.appendChild(frRefCanvas);
            frRefBox.appendChild(frRefBadge);
            frRefBox.onclick = () => selectCaseAndAlg(caseItem.id, 'FR', frPrimaryAlg, true);

            const titleCol = document.createElement('div');
            titleCol.className = 'flex flex-col gap-1 min-w-0';

            const tagsHtml = (caseItem.tags || []).map(t =>
              `<span class="px-1.5 py-0.2 rounded text-[10px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">${t}</span>`
            ).join('');

            const wrongBadgeHtml = caseItem.wrongRel
              ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-mono-alg bg-amber-500/15 text-amber-300">錯槽:${caseItem.wrongRel}</span>`
              : '';

            titleCol.innerHTML = `
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-sm font-bold text-white">${caseItem.displayNum} ${caseItem.title}</span>
                ${wrongBadgeHtml}
                ${tagsHtml}
              </div>
              <div class="text-[11px] text-slate-400">
                FR 基準: <code class="text-emerald-300 font-mono-alg">${frPrimaryAlg}</code>
              </div>
              <div class="text-[11px] text-amber-300/95 font-semibold">
                口訣: ${generatePlainMnemonicText(frPrimaryAlg)}
              </div>
            `;

            topHeaderLeft.appendChild(frRefBox);
            topHeaderLeft.appendChild(titleCol);
            topHeader.appendChild(topHeaderLeft);
            card.appendChild(topHeader);

            // Bottom Body: Current Slot 88x88 Thumbnail + Algorithms
            const bottomBody = document.createElement('div');
            bottomBody.className = 'flex gap-3 items-start';

            const canvas = document.createElement('canvas');
            canvas.className = 'w-[88px] h-[88px] rounded-xl bg-slate-950 border border-slate-800 shrink-0 cursor-pointer hover:border-sky-500/60 transition shadow-inner';
            const thumbAlg = (isCardActive && appState.activeAlgStr) ? appState.activeAlgStr : primaryAlg;
            renderCubeThumbnail(canvas, thumbAlg, appState.maskMode, slotKey, caseItem.id, caseItem.wrongRel, 88);
            canvas.onclick = () => selectCaseAndAlg(caseItem.id, slotKey, primaryAlg, true);

            const infoCol = document.createElement('div');
            infoCol.className = 'flex-1 min-w-0 flex flex-col gap-1.5';

            const slotSubHeader = document.createElement('div');
            slotSubHeader.className = 'flex items-center justify-between text-[11px] text-slate-400';
            slotSubHeader.innerHTML = `<span class="font-semibold text-sky-300">當前檢視槽位: ${SLOT_LABELS[slotKey]}</span>`;
            infoCol.appendChild(slotSubHeader);

            const algsList = document.createElement('div');
            algsList.className = 'flex flex-col gap-1.5';

            algObjs.forEach((algItem) => {
              const btn = document.createElement('button');
              const isSelected = isCardActive && appState.activeAlgStr === algItem.alg;
              btn.className = `alg-btn w-full text-left px-2.5 py-1.5 rounded-lg border text-xs font-mono-alg flex flex-col gap-1 ${
                isSelected ? 'selected-alg' : 'bg-slate-950 border-slate-800/90 text-slate-300'
              }`;

              const badgeHtml = algItem.badge
                ? `<span class="shrink-0 px-1.5 py-0.2 rounded text-[10px] font-sans font-semibold bg-amber-500/20 text-amber-300">${algItem.badge}</span>`
                : '';

              const mnemonicLine = `<div class="text-[11px] font-sans ${isSelected ? 'font-bold text-amber-300' : 'text-slate-400'} border-t border-slate-800/80 pt-1 flex items-center gap-1">
                     <span class="text-[10px] px-1 rounded bg-amber-500/15 text-amber-300 shrink-0">口訣</span>
                     <span class="truncate">${generatePlainMnemonicText(algItem.alg)}</span>
                   </div>`;

              btn.innerHTML = `
                <div class="w-full flex items-center justify-between gap-1.5">
                  <span class="truncate">${formatAlgWithBracketsHTML(algItem.alg)}</span>
                  ${badgeHtml}
                </div>
                ${mnemonicLine}
              `;

              btn.onclick = () => {
                renderCubeThumbnail(canvas, algItem.alg, appState.maskMode, slotKey, caseItem.id, caseItem.wrongRel, 88);
                selectCaseAndAlg(caseItem.id, slotKey, algItem.alg, true, algItem.badge ? { note: `技巧提示：${algItem.badge}` } : null);
                renderCasesList();
              };
              algsList.appendChild(btn);
            });

            infoCol.appendChild(algsList);
            bottomBody.appendChild(canvas);
            bottomBody.appendChild(infoCol);
            card.appendChild(bottomBody);
            grid.appendChild(card);
          });

          section.appendChild(grid);
        } else {
          // 4-Slot Compare View with Large 112x112 FR Reference Diagram in the Title Header + 84x84 Slot Thumbnails
          const list = document.createElement('div');
          list.className = 'flex flex-col gap-4';

          casesInCat.forEach(caseItem => {
            const rowCard = document.createElement('div');
            rowCard.dataset.caseId = caseItem.id;
            rowCard.className = `case-card rounded-xl p-4 flex flex-col gap-3.5 ${appState.activeCaseId === caseItem.id ? 'active-card' : ''}`;

            // Header with Prominent 112x112 FR Standard Reference Diagram
            const frPrimaryAlg = (caseItem.slots.FR && caseItem.slots.FR[0]) ? caseItem.slots.FR[0].alg : '';
            const header = document.createElement('div');
            header.className = 'flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-800/80';

            const headerLeft = document.createElement('div');
            headerLeft.className = 'flex items-center gap-3.5 min-w-0';

            // Large 112x112 FR Reference Canvas in Header
            const frHeaderBox = document.createElement('div');
            frHeaderBox.className = 'relative shrink-0 rounded-xl bg-slate-950 border border-emerald-500/40 p-1 cursor-pointer hover:border-emerald-400 transition shadow-md';
            frHeaderBox.title = '標準 FR (綠橘) Pair 狀態對照圖 — 點擊直接播放 FR 解法';
            const frHeaderCanvas = document.createElement('canvas');
            frHeaderCanvas.className = 'w-[112px] h-[112px] block';
            renderCubeThumbnail(frHeaderCanvas, frPrimaryAlg, appState.maskMode, 'FR', caseItem.id, caseItem.wrongRel, 112);
            const frHeaderTag = document.createElement('span');
            frHeaderTag.className = 'absolute bottom-1 right-1 px-1.5 py-0.2 rounded bg-emerald-500/90 text-slate-950 font-extrabold text-[9px]';
            frHeaderTag.textContent = 'FR 基準圖';
            frHeaderBox.appendChild(frHeaderCanvas);
            frHeaderBox.appendChild(frHeaderTag);
            frHeaderBox.onclick = () => selectCaseAndAlg(caseItem.id, 'FR', frPrimaryAlg, true);

            const headerTitleCol = document.createElement('div');
            headerTitleCol.className = 'flex flex-col gap-1 min-w-0';
            const tagsHtml = (caseItem.tags || []).map(t =>
              `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">${t}</span>`
            ).join('');

            headerTitleCol.innerHTML = `
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-sm sm:text-base font-bold text-white">${caseItem.displayNum} ${caseItem.title}</span>
                ${caseItem.wrongRel ? `<span class="px-2 py-0.5 rounded text-xs font-mono-alg bg-amber-500/15 text-amber-300 border border-amber-500/30">錯槽: ${caseItem.wrongRel}</span>` : ''}
                ${tagsHtml}
              </div>
              <div class="text-xs text-slate-400 flex flex-wrap items-center gap-2">
                <span>FR 基準公式: <code class="text-emerald-300 font-mono-alg">${frPrimaryAlg}</code></span>
                <span class="text-amber-300/90 font-medium">口訣: ${generatePlainMnemonicText(frPrimaryAlg)}</span>
              </div>
            `;

            headerLeft.appendChild(frHeaderBox);
            headerLeft.appendChild(headerTitleCol);
            header.appendChild(headerLeft);
            rowCard.appendChild(header);

            const fourCols = document.createElement('div');
            fourCols.className = 'grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3';

            ['FR', 'BR', 'FL', 'BL'].forEach(slotKey => {
              const slotAlgObjs = caseItem.slots[slotKey] || [];
              const primaryAlg = slotAlgObjs[0] ? slotAlgObjs[0].alg : '';

              const slotBox = document.createElement('div');
              slotBox.className = 'bg-slate-950 border border-slate-800/80 rounded-xl p-2.5 flex items-start gap-2.5';

              const miniCanvas = document.createElement('canvas');
              miniCanvas.className = 'w-[84px] h-[84px] rounded-lg bg-slate-900 border border-slate-800/80 shrink-0 cursor-pointer hover:border-sky-500/60 transition';
              renderCubeThumbnail(miniCanvas, primaryAlg, appState.maskMode, slotKey, caseItem.id, caseItem.wrongRel, 84);
              miniCanvas.onclick = () => selectCaseAndAlg(caseItem.id, slotKey, primaryAlg, true);

              const slotMeta = document.createElement('div');
              slotMeta.className = 'flex flex-col gap-1.5 min-w-0 flex-1';
              slotMeta.innerHTML = `<span class="text-xs font-bold text-slate-300">${slotKey}</span>`;

              slotAlgObjs.forEach(algItem => {
                const algBtn = document.createElement('button');
                const isSelected = appState.activeCaseId === caseItem.id && appState.activeAlgSlot === slotKey && appState.activeAlgStr === algItem.alg;
                algBtn.className = `alg-btn text-left px-2 py-1 rounded-lg border text-[11px] font-mono-alg flex flex-col gap-0.5 ${
                  isSelected ? 'selected-alg' : 'bg-slate-900 border-slate-800 text-slate-300'
                }`;
                const mnemonicSub = isSelected
                  ? `<span class="text-[10px] font-sans font-bold text-amber-300 truncate">口訣: ${generatePlainMnemonicText(algItem.alg)}</span>`
                  : '';
                algBtn.innerHTML = `
                  <span class="truncate">${formatAlgWithBracketsHTML(algItem.alg)}</span>
                  ${mnemonicSub}
                `;
                algBtn.onclick = () => {
                  renderCubeThumbnail(miniCanvas, algItem.alg, appState.maskMode, slotKey, caseItem.id, caseItem.wrongRel, 84);
                  selectCaseAndAlg(caseItem.id, slotKey, algItem.alg, true);
                  renderCasesList();
                };
                slotMeta.appendChild(algBtn);
              });

              slotBox.appendChild(miniCanvas);
              slotBox.appendChild(slotMeta);
              fourCols.appendChild(slotBox);
            });

            rowCard.appendChild(fourCols);
            list.appendChild(rowCard);
          });

          section.appendChild(list);
        }

        container.appendChild(section);
      });
    }

    function highlightActiveCardInDOM() {
      document.querySelectorAll('.case-card').forEach(card => {
        const cid = Number(card.dataset.caseId);
        card.classList.toggle('active-card', cid === appState.activeCaseId);
      });
    }

    /*************************************************************************
     * 8. INITIALIZATION & EVENTS
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      initThreePlayer();
      renderCategoryFilterBar();
      renderCasesList();

      // Load Case #1 by default
      const firstCase = UNIFIED_F2L_CASES[0];
      selectCaseAndAlg(firstCase.id, 'FR', firstCase.slots.FR[0].alg, false);
      requestAnimationFrame(mainAnimationLoop);

      // Custom Wrong-Slot Generator
      document.getElementById('btn-generate-wrong-slot').addEventListener('click', () => {
        const t = document.getElementById('ws-gen-target').value;
        const w = document.getElementById('ws-gen-wrong').value;
        const selType = document.getElementById('ws-gen-type');
        const st = selType.value;
        const alg = buildCustomWrongSlotAlg(t, w, st);
        const typeLabel = selType.options[selType.selectedIndex].text;
        selectCaseAndAlg(999, t, alg, true, {
          wrongSlot: w,
          code: '自訂',
          title: `${SLOT_LABELS[t]} 卡在 ${SLOT_LABELS[w]} (${typeLabel})`,
          note: `從 ${w} 槽提出目標塊後對齊入 ${t} 槽`
        });
      });

      // Slot Filter Tabs
      document.querySelectorAll('.slot-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const slot = btn.dataset.slot;
          appState.selectedSlot = slot;
          appState.viewMode = 'single';
          document.getElementById('view-mode-toggle').textContent = '切換：四面對照總覽';
          document.querySelectorAll('.slot-tab-btn').forEach(b => {
            b.className = b.dataset.slot === slot
              ? 'slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition'
              : 'slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 transition';
          });
          const currentCase = UNIFIED_F2L_CASES.find(c => c.id === appState.activeCaseId) || UNIFIED_F2L_CASES[0];
          const firstAlg = currentCase.slots[slot][0] ? currentCase.slots[slot][0].alg : '';
          selectCaseAndAlg(currentCase.id, slot, firstAlg, false);
          renderCasesList();
        });
      });

      // Single vs 4-Slot Compare Toggle
      const viewToggleBtn = document.getElementById('view-mode-toggle');
      viewToggleBtn.addEventListener('click', () => {
        appState.viewMode = appState.viewMode === 'single' ? 'compare' : 'single';
        viewToggleBtn.textContent = appState.viewMode === 'single' ? '切換：四面對照總覽' : '切換：單槽列表';
        renderCasesList();
      });

      // Mask Mode Buttons
      document.querySelectorAll('.mask-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const mode = btn.dataset.mask;
          appState.maskMode = mode;
          document.querySelectorAll('.mask-mode-btn').forEach(b => {
            b.className = b.dataset.mask === mode
              ? 'mask-mode-btn px-2 py-1 rounded-md font-medium bg-sky-500/20 text-sky-300 transition'
              : 'mask-mode-btn px-2 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition';
          });
          updateThreeStickerColors();
          renderCasesList();
        });
      });

      // Thumbnail Cam Buttons
      document.querySelectorAll('.thumb-cam-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const mode = btn.dataset.thumbcam;
          appState.thumbCamMode = mode;
          document.querySelectorAll('.thumb-cam-btn').forEach(b => {
            b.className = b.dataset.thumbcam === mode
              ? 'thumb-cam-btn px-2 py-1 rounded-md font-medium bg-slate-800 text-slate-200 transition'
              : 'thumb-cam-btn px-2 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition';
          });
          renderCasesList();
        });
      });

      // Search
      document.getElementById('search-input').addEventListener('input', (e) => {
        appState.searchQuery = e.target.value;
        renderCasesList();
      });

      // Playback Buttons
      document.getElementById('btn-play-pause').addEventListener('click', () => {
        if (appState.isPlaying) pausePlayback();
        else startPlayback();
      });
      document.getElementById('btn-step-next').addEventListener('click', stepForward);
      document.getElementById('btn-step-prev').addEventListener('click', stepBackward);
      document.getElementById('btn-to-start').addEventListener('click', () => {
        pausePlayback();
        snapThreeCubeToStep(0);
      });
      document.getElementById('btn-to-end').addEventListener('click', () => {
        pausePlayback();
        snapThreeCubeToStep(appState.parsedMoves.length);
      });

      // Speed & Loop
      const speedSlider = document.getElementById('speed-slider');
      const speedLabel = document.getElementById('speed-label');
      speedSlider.addEventListener('input', (e) => {
        appState.animSpeed = parseFloat(e.target.value);
        speedLabel.textContent = appState.animSpeed.toFixed(1) + 'x';
      });
      document.getElementById('loop-checkbox').addEventListener('change', (e) => {
        appState.autoLoop = e.target.checked;
      });

      // Camera Presets
      document.querySelectorAll('.cam-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => setCameraPreset(btn.dataset.cam));
      });
    });
  </script>
</body>
</html>
