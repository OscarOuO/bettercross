<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四面 F2L & 錯槽 3D 視覺化教學 (白底綠前)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090d16;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-mono-alg {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .case-card {
      background-color: #111827;
      border: 1px solid #1e293b;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .case-card:hover {
      border-color: #334155;
    }
    .case-card.active-card {
      border-color: #38bdf8;
      background-color: #131c31;
    }
    .alg-btn {
      transition: all 0.12s ease;
    }
    .alg-btn:hover {
      background-color: #1e293b;
      border-color: #475569;
    }
    .alg-btn.selected-alg {
      background-color: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
    }
    .move-pill {
      transition: all 0.12s ease;
    }
    .move-pill.active-move {
      background-color: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .move-pill.done-move {
      background-color: #0f172a;
      color: #64748b;
      border-color: #1e293b;
    }
    .move-pill.phase-setup {
      border-color: rgba(56, 189, 248, 0.55);
      color: #7dd3fc;
    }
    .move-pill.phase-insert {
      border-color: rgba(16, 185, 129, 0.55);
      color: #6ee7b7;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Clean Single-Bar Top Navigation (Unified Library) -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800/80 px-4 py-2.5">
    <div class="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-2.5">
      <!-- Brand & Unified Summary -->
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="flex items-center gap-2 pr-2 border-r border-slate-800">
          <span class="px-2 py-0.5 rounded bg-sky-500 text-slate-950 font-extrabold text-xs">F2L</span>
          <span class="font-bold text-sm text-white">四面 & 錯槽全集 3D 教學</span>
          <span class="text-[11px] text-slate-400 hidden sm:inline">白底綠前 • 單一整合總庫 (95組)</span>
        </div>
        <div class="hidden xl:flex items-center gap-2 text-[11px] text-slate-400">
          <span><code class="text-sky-300 font-mono-alg">(Setup)</code> 配對</span>
          <span>•</span>
          <span><code class="text-emerald-300 font-mono-alg">[Insert]</code> 入槽</span>
          <span>•</span>
          <span class="text-amber-300">含空槽 Open / EO / 錯槽借位</span>
        </div>
      </div>

      <!-- Right Controls: Mask & Thumbnail Cam -->
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5">
          <button data-mask="f2l" class="mask-mode-btn px-2 py-1 rounded-md font-medium bg-sky-500/20 text-sky-300 transition">
            頂層灰遮罩
          </button>
          <button data-mask="slot" class="mask-mode-btn px-2 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition">
            聚焦單組
          </button>
          <button data-mask="full" class="mask-mode-btn px-2 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition">
            完整六色
          </button>
        </div>

        <div class="hidden md:flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5">
          <button data-thumbcam="ufr" class="thumb-cam-btn px-2 py-1 rounded-md font-medium bg-slate-800 text-slate-200 transition" title="縮圖固定顯示綠前與橘右">
            縮圖: 固定前右
          </button>
          <button data-thumbcam="slot" class="thumb-cam-btn px-2 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition" title="自動旋轉縮圖對準目標槽">
            縮圖: 對準槽位
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Layout (Natural Full-Page Scroll, Compact Left Sidebar) -->
  <div class="max-w-[1440px] w-full mx-auto flex-1 flex flex-col lg:flex-row items-start gap-5 p-4">

    <!-- LEFT PANEL: Compact Sticky 3D Player (310px wide on Desktop) -->
    <aside class="w-full lg:w-[310px] shrink-0 lg:sticky lg:top-14">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col gap-3 shadow-lg">

        <!-- Compact Case Header -->
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
              <span id="player-slot-badge" class="px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-300 font-semibold">
                FR 綠橘槽
              </span>
              <span id="player-wrong-slot-badge" class="hidden px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 font-semibold">
                錯放: BR
              </span>
              <span id="player-cat-badge" class="text-slate-400 truncate">Basic</span>
            </div>
            <h2 id="player-case-title" class="text-sm font-bold text-white mt-1 truncate">
              Case #1 • 基礎入槽
            </h2>
          </div>
          <span id="step-counter-badge" class="shrink-0 text-[11px] font-mono-alg text-slate-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">
            0 / 4
          </span>
        </div>

        <!-- Compact 3D Canvas (210px height, wheel scrolling passes through to page!) -->
        <div class="relative w-full h-[210px] bg-slate-950 rounded-lg border border-slate-800/90 overflow-hidden select-none">
          <div id="three-canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

          <!-- Minimal Orientation Legend -->
          <div class="pointer-events-none absolute top-2 left-2 flex items-center gap-1.5 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-slate-300 border border-slate-800">
            <span class="w-2 h-2 rounded-full bg-green-500"></span>F綠
            <span class="w-2 h-2 rounded-full bg-orange-500 ml-0.5"></span>R橘
            <span class="w-2 h-2 rounded-full bg-white ml-0.5"></span>D白
          </div>

          <!-- Camera Angle Quick Switch -->
          <div class="absolute bottom-1.5 inset-x-1.5 flex items-center justify-between gap-1">
            <div class="flex items-center gap-1">
              <button data-cam="FR" class="cam-preset-btn px-1.5 py-0.5 rounded bg-slate-900/90 hover:bg-slate-800 text-[10px] font-medium text-slate-300 border border-slate-700/80 transition">FR</button>
              <button data-cam="BR" class="cam-preset-btn px-1.5 py-0.5 rounded bg-slate-900/90 hover:bg-slate-800 text-[10px] font-medium text-slate-300 border border-slate-700/80 transition">BR</button>
              <button data-cam="FL" class="cam-preset-btn px-1.5 py-0.5 rounded bg-slate-900/90 hover:bg-slate-800 text-[10px] font-medium text-slate-300 border border-slate-700/80 transition">FL</button>
              <button data-cam="BL" class="cam-preset-btn px-1.5 py-0.5 rounded bg-slate-900/90 hover:bg-slate-800 text-[10px] font-medium text-slate-300 border border-slate-700/80 transition">BL</button>
            </div>
            <button data-cam="BOTTOM" class="cam-preset-btn px-1.5 py-0.5 rounded bg-slate-900/90 hover:bg-slate-800 text-[10px] font-medium text-slate-300 border border-slate-700/80 transition">看白底</button>
          </div>
        </div>

        <!-- Active Algorithm & Step Pills -->
        <div class="bg-slate-950 border border-slate-800/80 rounded-lg p-2.5 flex flex-col gap-2">
          <div class="flex items-center justify-between gap-2 text-xs">
            <span class="text-slate-400 text-[11px]">公式步驟:</span>
            <span id="raw-alg-display" class="font-mono-alg text-emerald-400 font-semibold text-xs truncate">U (R U' R')</span>
          </div>
          <!-- Phase Legend (shown when (setup) or [insert] brackets exist) -->
          <div id="phase-legend-bar" class="hidden flex items-center gap-2 text-[10px] text-slate-400 border-b border-slate-800/80 pb-1">
            <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-sky-400/80"></span>(Setup 配對)</span>
            <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-emerald-400/80"></span>[Insert 入槽]</span>
          </div>
          <div id="move-tokens-container" class="flex flex-wrap items-center gap-1 min-h-[26px]"></div>
          <div id="alg-note-banner" class="hidden text-[11px] text-amber-300/90 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded"></div>
        </div>

        <!-- Interactive Chinese Mnemonic Generator Box (口訣生成器) -->
        <div class="bg-slate-950 border border-slate-800/90 rounded-lg p-2.5 flex flex-col gap-1.5">
          <div class="flex items-center justify-between text-[11px]">
            <span class="font-semibold text-amber-300 flex items-center gap-1">
              <span>💡 直覺中文口訣</span>
            </span>
            <span class="text-[10px] text-slate-500 font-mono-alg">F壓/回 • U左/右 • R,L'上 • R',L下</span>
          </div>
          <div id="mnemonic-phrase-display" class="text-xs font-bold tracking-wide text-slate-100 bg-slate-900/90 border border-slate-800 rounded px-2.5 py-1.5 leading-relaxed">
            左 (上 右 下)
          </div>
          <div id="mnemonic-steps-detail" class="flex flex-wrap items-center gap-1 pt-0.5"></div>
        </div>

        <!-- Compact Playback Controls -->
        <div class="grid grid-cols-5 gap-1.5 text-xs">
          <button id="btn-to-start" title="重置回未解狀態" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium flex items-center justify-center border border-slate-700/80 transition">
            重置
          </button>
          <button id="btn-step-prev" title="上一步" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium flex items-center justify-center border border-slate-700/80 transition">
            ◀
          </button>
          <button id="btn-play-pause" class="py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold flex items-center justify-center gap-1 transition">
            <span id="label-play-pause">播放</span>
          </button>
          <button id="btn-step-next" title="下一步" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium flex items-center justify-center border border-slate-700/80 transition">
            ▶
          </button>
          <button id="btn-to-end" title="跳至完成" class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium flex items-center justify-center border border-slate-700/80 transition">
            完成
          </button>
        </div>

        <!-- Speed & Loop -->
        <div class="flex items-center justify-between gap-3 text-[11px] text-slate-400 pt-0.5">
          <div class="flex items-center gap-1.5 flex-1">
            <span>速度</span>
            <input id="speed-slider" type="range" min="0.4" max="2.8" step="0.2" value="1.2" class="w-full accent-sky-400 cursor-pointer h-1">
            <span id="speed-label" class="font-mono-alg text-slate-300 w-7 text-right">1.2x</span>
          </div>
          <label class="flex items-center gap-1 cursor-pointer select-none hover:text-slate-200">
            <input id="loop-checkbox" type="checkbox" class="rounded accent-emerald-500 w-3 h-3">
            <span>循環</span>
          </label>
        </div>

      </div>
    </aside>

    <!-- RIGHT PANEL: Unified Formula Library (Standard #1-41 + Wrong Slot #42-95) -->
    <main class="flex-1 min-w-0 w-full flex flex-col gap-4">

      <!-- Unified Filter & Slot Bar -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <!-- Slot Selector + 4-Slot Compare Toggle -->
          <div class="flex flex-wrap items-center gap-1">
            <span class="text-[11px] text-slate-400 mr-1">目標槽位:</span>
            <button data-slot="FR" class="slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition">
              FR 綠橘
            </button>
            <button data-slot="BR" class="slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">
              BR 橘藍
            </button>
            <button data-slot="FL" class="slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">
              FL 綠紅
            </button>
            <button data-slot="BL" class="slot-tab-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 transition">
              BL 藍紅
            </button>
            <span class="mx-1 text-slate-700">|</span>
            <button id="view-mode-toggle" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:text-white transition">
              切換：單槽列表
            </button>
          </div>

          <!-- Search Input -->
          <div class="relative w-full sm:w-60">
            <input id="search-input" type="text" placeholder="搜尋編號 (#1~#95)、標籤或公式..." class="w-full bg-slate-950 border border-slate-800 focus:border-slate-600 rounded-lg pl-2.5 pr-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 outline-none">
          </div>
        </div>

        <!-- Unified Category Filter Pills (11 Categories: 8 Standard + 3 Wrong-Slot) -->
        <div id="category-filter-bar" class="flex flex-wrap items-center gap-1 pt-2 border-t border-slate-800/70"></div>
      </div>

      <!-- Collapsible Custom Wrong-Slot Builder -->
      <details class="bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 group">
        <summary class="flex items-center justify-between cursor-pointer list-none text-xs font-semibold text-slate-300 hover:text-white">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold text-[11px]">自訂錯槽產生器</span>
            <span class="text-slate-400 font-normal">自由指定「哪一組目標 Pair」卡在「哪個錯槽」即時模擬</span>
          </div>
          <span class="text-slate-500 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div class="pt-3 mt-2 border-t border-slate-800 grid grid-cols-1 sm:grid-cols-4 gap-2.5 items-end text-xs">
          <div class="flex flex-col gap-1">
            <label class="text-slate-400">1. 目標 Pair (正確槽)</label>
            <select id="ws-gen-target" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 font-semibold text-emerald-300 outline-none">
              <option value="FR" selected>綠橘 Pair (FR)</option>
              <option value="BR">橘藍 Pair (BR)</option>
              <option value="FL">綠紅 Pair (FL)</option>
              <option value="BL">藍紅 Pair (BL)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-slate-400">2. 目前卡在哪個錯槽</label>
            <select id="ws-gen-wrong" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 font-semibold text-amber-300 outline-none">
              <option value="BR" selected>BR 右後槽 (橘藍)</option>
              <option value="FL">FL 左前槽 (綠紅)</option>
              <option value="BL">BL 左後槽 (藍紅)</option>
              <option value="FR">FR 右前槽 (綠橘)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-slate-400">3. 錯槽內卡住型態</label>
            <select id="ws-gen-type" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 font-semibold text-sky-300 outline-none">
              <option value="PAIR_SOLVED" selected>整組標配 Pair 連好</option>
              <option value="PAIR_FLIPPED">整組反相 Pair 連塊</option>
              <option value="EDGE_ONLY">僅「邊塊」卡在錯槽</option>
              <option value="CORNER_ONLY">僅「角塊」卡在錯槽</option>
            </select>
          </div>
          <button id="btn-generate-wrong-slot" class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition h-[34px]">
            生成並播放 ▶
          </button>
        </div>
      </details>

      <!-- Unified Cases Container -->
      <div id="cases-list-container" class="flex flex-col gap-6 pb-10"></div>

    </main>
  </div>

  <script>
    /*************************************************************************
     * 1. UNIFIED CATEGORIES (STANDARD #1-41 + WRONG SLOT #42-95)
     *************************************************************************/
    const F2L_CATEGORIES = [
      { id: "ALL", name: "全部總覽 (95組)", short: "全部 (95)" },
      { id: "BASIC", name: "1. Basic Inserts 基礎入槽 (#1-#4)", short: "1. 基礎入槽" },
      { id: "CASE1", name: "2. F2L Case 1 頂層分離型一 (#5-#10)", short: "2. 分離型一" },
      { id: "CASE2", name: "3. F2L Case 2 頂層分離型二 (#11-#14)", short: "3. 分離型二" },
      { id: "CASE3", name: "4. F2L Case 3 白朝上分離型 (#15-#18)", short: "4. 白朝上分離" },
      { id: "INCORRECT", name: "5. Connected Pairs 頂層錯誤相連 (#19-#24)", short: "5. 頂層連塊" },
      { id: "CORNER_IN", name: "6. Corner in Slot 角在目標槽 (#25-#30)", short: "6. 角在槽" },
      { id: "EDGE_IN", name: "7. Edge in Slot 邊在目標槽 (#31-#36)", short: "7. 邊在槽" },
      { id: "BOTH_IN", name: "8. Both in Slot 邊角皆在目標槽 (#37-#41)", short: "8. 皆在槽" },
      { id: "TRAPPED_CORNER", name: "9. Corner in Wrong Slot 角塊卡在錯槽 (#42-#59)", short: "9. 錯槽:角卡住", isWrongSlot: true },
      { id: "TRAPPED_EDGE", name: "10. Edge in Wrong Slot 邊塊卡在錯槽 (#60-#77)", short: "10. 錯槽:邊卡住", isWrongSlot: true },
      { id: "BOTH_TRAPPED", name: "11. Both Trapped / Swap 雙塊卡錯槽與互換 (#78-#95)", short: "11. 錯槽:整組/互換", isWrongSlot: true }
    ];

    const F2L_CASES = [
      // 1. BASIC INSERTS (1-4)
      {
        id: 1, cat: "BASIC", title: "白朝前/後、遠離配對入槽",
        FR: ["U (R U' R')"],
        BR: ["y U (R U' R')", "y' U (L U' L')"],
        FL: ["y' U (R U' R')", "y U (L U' L')"],
        BL: ["U (L U' L')"]
      },
      {
        id: 2, cat: "BASIC", title: "白朝右/左、遠離配對入槽",
        FR: ["y' U' (R' U R)", "y U' (L' U L)", "U' (F' U F)"],
        BR: ["U' (R' U R)"],
        FL: ["U' (L' U L)"],
        BL: ["y U' (R' U R)", "y' U' (L' U L)"]
      },
      {
        id: 3, cat: "BASIC", title: "已成對、前/左側直接入槽",
        FR: ["y' (R' U' R)", "y (L' U' L)", "(F' U' F)"],
        BR: ["(R' U' R)"],
        FL: ["(L' U' L)"],
        BL: ["y (R' U' R)", "y' (L' U' L)"]
      },
      {
        id: 4, cat: "BASIC", title: "已成對、右/後側直接入槽",
        FR: ["(R U R')"],
        BR: ["y (R U R')", "y' (L U L')"],
        FL: ["y' (R U R')", "y (L U L')"],
        BL: ["(L U L')"]
      },

      // 2. F2L CASE 1 (5-10)
      {
        id: 5, cat: "CASE1", title: "白朝前/後、同色在頂藏角配對",
        FR: ["U' (R U' R' U) y' (R' U' R)", "y' U (R' U' R U') (R' U' R)"],
        BR: ["U (R' U' R U') (R' U' R)"],
        FL: ["U (L' U' L U') (L' U' L)"],
        BL: ["y U (R' U' R U') (R' U' R)"]
      },
      {
        id: 6, cat: "CASE1", title: "白朝右/左、同色在頂順手藏角",
        FR: ["U' (R U R' U) (R U R')"],
        BR: ["U (R' U R U') y (R U R')"],
        FL: ["U (L' U L U') y' (R U R')"],
        BL: ["U' (L U L' U) (L U L')"]
      },
      {
        id: 7, cat: "CASE1", title: "白朝前/後、邊塊在遠端 U2 配對",
        FR: ["U' (R U2' R' U) y' (R' U' R)", "U' (R U2' R') d (R' U' R)"],

    /*************************************************************************
     * 2. MATHEMATICAL CUBE ENGINE (STRICT WHITE-BOTTOM, GREEN-FRONT)
     *************************************************************************/
    const FACE_COLORS = {
      U: '#facc15',
      D: '#ffffff',
      F: '#16a34a',
      B: '#2563eb',
      R: '#ff7a00',
      L: '#dc2626',
      GREY: '#64748b',
      CORE: '#0f172a'
    };

    const SLOT_HOME_COORDS = {
      FR: [1, 1],
      BR: [1, -1],
      FL: [-1, 1],
      BL: [-1, -1]
    };

    const BASE_MOVES = {
      'R': { axis: 'x', layers: [1],  dir: -1 },
      'L': { axis: 'x', layers: [-1], dir:  1 },
      'U': { axis: 'y', layers: [1],  dir: -1 },
      'D': { axis: 'y', layers: [-1], dir:  1 },
      'F': { axis: 'z', layers: [1],  dir: -1 },
      'B': { axis: 'z', layers: [-1], dir:  1 },
      'r': { axis: 'x', layers: [0, 1],  dir: -1 },
      'l': { axis: 'x', layers: [-1, 0], dir:  1 },
      'u': { axis: 'y', layers: [0, 1],  dir: -1 },
      'd': { axis: 'y', layers: [-1, 0], dir:  1 },
      'f': { axis: 'z', layers: [0, 1],  dir: -1 },
      'b': { axis: 'z', layers: [-1, 0], dir:  1 },
      'M': { axis: 'x', layers: [0], dir:  1 },
      'E': { axis: 'y', layers: [0], dir:  1 },
      'S': { axis: 'z', layers: [0], dir: -1 },
      'x': { axis: 'x', layers: [-1, 0, 1], dir: -1 },
      'y': { axis: 'y', layers: [-1, 0, 1], dir: -1 },
      'z': { axis: 'z', layers: [-1, 0, 1], dir: -1 }
    };

    let appState = {
      mainTab: 'academy', // Default to the newly added Cube Academy 77-case tab
      selectedSlot: 'FR',
      selectedCategory: 'ALL',
      viewMode: 'compare', // Default to 'compare' so 4-slot cards + Large Header FR Diagram are immediately visible!
      academyCategory: 'ALL',
      academySearchQuery: '',
      af2lSlot: 'FR',
      af2lCategory: 'ALL',
      af2lViewMode: 'single', // 'single' | 'compare'
      maskMode: 'f2l',
      thumbCamMode: 'slot', // Default slot-aligned thumbnails for clear 4-slot comparison
      searchQuery: '',
      af2lSearchQuery: '',
      activeCaseId: 1,
      activeAlgSlot: 'FR',
      activeWrongSlot: null,
      activeAlgStr: "U (R U' R')",
      parsedMoves: [],
      currentStep: 0,
      isPlaying: false,
      animSpeed: 1.2,
      autoLoop: false
    };

    /**
     * Expands repeated groups like `(U R U' R')*3` or `(L U L' U')*2`
     * and preserves `( ... )` setup vs `[ ... ]` insert phase tags on each move token!
     */
    function expandRepeatedTriggers(str) {
      if (!str) return '';
      return str.replace(/\(([^)]+)\)\s*\*(\d+)/g, (_, inner, count) => {
        const n = Math.min(6, Math.max(1, parseInt(count, 10) || 1));
        return Array(n).fill(`(${inner.trim()})`).join(' ');
      }).replace(/\[([^\]]+)\]\s*\*(\d+)/g, (_, inner, count) => {
        const n = Math.min(6, Math.max(1, parseInt(count, 10) || 1));
        return Array(n).fill(`[${inner.trim()}]`).join(' ');
      });
    }

    function parseAlg(algStr) {
      if (!algStr) return [];
      const expanded = expandRepeatedTriggers(algStr);
      const tokenRegex = /(\(|\)|\[|\])|([RLUDFBrludfbMESxyz])(2'|'|2)?/g;
      const tokens = [];
      let currentPhase = 'pre'; // 'pre' | 'setup' | 'insert'
      let match;
      while ((match = tokenRegex.exec(expanded)) !== null) {
        const bracket = match[1];
        if (bracket) {
          if (bracket === '(') currentPhase = 'setup';
          else if (bracket === ')') currentPhase = 'pre';
          else if (bracket === '[') currentPhase = 'insert';
          else if (bracket === ']') currentPhase = 'pre';
          continue;
        }
        const face = match[2];
        const mod = match[3] || '';
        const base = BASE_MOVES[face];
        if (!base) continue;
        let quarterTurns = base.dir;
        if (mod === "'") quarterTurns = -base.dir;
        else if (mod === "2") quarterTurns = base.dir * 2;
        else if (mod === "2'") quarterTurns = -base.dir * 2;

        tokens.push({
          raw: face + mod,
          face,
          mod,
          axis: base.axis,
          layers: base.layers,
          quarters: quarterTurns,
          phase: currentPhase
        });
      }
      return tokens;
    }

    function invertMove(m) {
      let invMod = '';
      if (m.mod === '') invMod = "'";
      else if (m.mod === "'") invMod = '';
      else if (m.mod === '2') invMod = "2'";
      else if (m.mod === "2'") invMod = '2';
      return {
        ...m,
        raw: m.face + invMod,
        mod: invMod,
        quarters: -m.quarters
      };
    }

    function rotateVec90(vec, axis, quarters) {
      let [x, y, z] = vec;
      const steps = ((quarters % 4) + 4) % 4;
      for (let i = 0; i < steps; i++) {
        if (axis === 'x') {
          // Right-hand rule around +X: +Y -> +Z -> -Y -> -Z
          const ny = -z, nz = y;
          y = ny; z = nz;
        } else if (axis === 'y') {
          // Right-hand rule around +Y: +Z -> +X -> -Z -> -X
          const nx = z, nz = -x;
          x = nx; z = nz;
        } else if (axis === 'z') {
          // Right-hand rule around +Z: +X -> +Y -> -X -> -Y
          const nx = -y, ny = x;
          x = nx; y = ny;
        }
      }
      return [Math.round(x), Math.round(y), Math.round(z)];
    }

    function createSolvedLogicalCube() {
      const cubies = [];
      for (let hx = -1; hx <= 1; hx++) {
        for (let hy = -1; hy <= 1; hy++) {
          for (let hz = -1; hz <= 1; hz++) {
            const stickers = [];
            if (hx === 1)  stickers.push({ homeFace: 'R', color: FACE_COLORS.R, normal: [1, 0, 0] });
            if (hx === -1) stickers.push({ homeFace: 'L', color: FACE_COLORS.L, normal: [-1, 0, 0] });
            if (hy === 1)  stickers.push({ homeFace: 'U', color: FACE_COLORS.U, normal: [0, 1, 0] });
            if (hy === -1) stickers.push({ homeFace: 'D', color: FACE_COLORS.D, normal: [0, -1, 0] });
            if (hz === 1)  stickers.push({ homeFace: 'F', color: FACE_COLORS.F, normal: [0, 0, 1] });
            if (hz === -1) stickers.push({ homeFace: 'B', color: FACE_COLORS.B, normal: [0, 0, -1] });

            cubies.push({
              home: [hx, hy, hz],
              pos: [hx, hy, hz],
              stickers
            });
          }
        }
      }
      return cubies;
    }

    function applyMoveToLogicalCube(cubies, move) {
      const axisIdx = move.axis === 'x' ? 0 : (move.axis === 'y' ? 1 : 2);
      for (const c of cubies) {
        if (move.layers.includes(c.pos[axisIdx])) {
          c.pos = rotateVec90(c.pos, move.axis, move.quarters);
          for (const s of c.stickers) {
            s.normal = rotateVec90(s.normal, move.axis, move.quarters);
          }
        }
      }
    }

    /**
     * Exact group-theoretic inverse setup:
     * If an algorithm M_1 M_2 ... M_n includes whole-cube rotations (y, y', x, z),
     * wide moves (d, r, l, u, f, b), or slice moves (M, E, S) that move the centers,
     * then starting at S_0 (where centers are strictly White=D, Green=F, Orange=R)
     * and executing M_1 ... M_n arrives at S_final where the whole cube has been
     * rotated by the net center transformation of M_1 ... M_n.
     *
     * Therefore:
     *   S_0 = inv(M_1) * inv(M_2) * ... * inv(M_n) * (C_net * Solved)
     * where C_net is the rigid-body rotation of the centers produced by M_1 ... M_n.
     * This guarantees 100% that:
     *   1) At Step 0 (S_0), White is at Bottom (0,-1,0) and Green is at Front (0,0,1).
     *   2) Playing M_1 ... M_n forward from S_0 solves the cube 100% accurately!
     */
    function getForwardCenterMoves(moves) {
      return moves.filter(m => m.layers.includes(0)).map(m => ({
        axis: m.axis,
        layers: [-1, 0, 1],
        quarters: m.quarters
      }));
    }

    function computeCaseStartLogicalCube(algStr) {
      const moves = parseAlg(algStr);
      const cube = createSolvedLogicalCube();

      // 1. Pre-orient the solved cube to the final center orientation of the algorithm
      const centerMoves = getForwardCenterMoves(moves);
      for (const cm of centerMoves) {
        applyMoveToLogicalCube(cube, cm);
      }

      // 2. Apply exact inverse of M_n ... M_1
      for (let i = moves.length - 1; i >= 0; i--) {
        const inv = invertMove(moves[i]);
        applyMoveToLogicalCube(cube, inv);
      }

      return cube;
    }

    function getStickerDisplayColor(cubie, sticker, maskMode, targetSlot = 'FR') {
      const [hx, hy, hz] = cubie.home;
      if (maskMode === 'full') return sticker.color;
      if (hy === 1) return FACE_COLORS.GREY;
      if (maskMode === 'f2l') return sticker.color;
      if (maskMode === 'slot') {
        const isCenter = (Math.abs(hx) + Math.abs(hy) + Math.abs(hz)) === 1;
        const isCrossEdge = (hy === -1 && (Math.abs(hx) + Math.abs(hz) === 1));
        if (isCenter || isCrossEdge) return sticker.color;

        const [tx, tz] = SLOT_HOME_COORDS[targetSlot] || [1, 1];
        const isTargetPair = (hx === tx && hz === tz && (hy === -1 || hy === 0));
        return isTargetPair ? sticker.color : '#334155';
      }
      return sticker.color;
    }

    /*************************************************************************
     * 3. THREE.JS 3D INTERACTIVE CUBE ENGINE (COMPACT SIZE, NO WHEEL HIJACK)
     *************************************************************************/
    let scene, camera, renderer, cubeRootGroup, activePivotGroup;
    let threeCubies = [];
    let currentTween = null;
    let lastFrameTime = performance.now();
    let loopTimeoutId = null;

    // Pulled back radius (7.5) so the cube fits comfortably with breathing room
    let camSpherical = { radius: 7.5, theta: 0.58, phi: 1.08 };
    let targetSpherical = { radius: 7.5, theta: 0.58, phi: 1.08 };
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };

    function initThreePlayer() {
      const container = document.getElementById('three-canvas-container');
      const w = container.clientWidth || 280;
      const h = container.clientHeight || 210;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(34, w / h, 0.1, 100);
      updateCameraFromSpherical(true);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.88));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(6, 10, 8);
      scene.add(dirLight);

      cubeRootGroup = new THREE.Group();
      scene.add(cubeRootGroup);

      activePivotGroup = new THREE.Group();
      cubeRootGroup.add(activePivotGroup);

      buildThreeCubies();

      // Pointer drag for 3D rotation ONLY (no wheel listener so page scrolls naturally!)
      const domEl = renderer.domElement;
      domEl.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevPointer = { x: e.clientX, y: e.clientY };
        domEl.setPointerCapture(e.pointerId);
      });
      domEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevPointer.x;
        const dy = e.clientY - prevPointer.y;
        prevPointer = { x: e.clientX, y: e.clientY };
        targetSpherical.theta -= dx * 0.0085;
        targetSpherical.phi = Math.max(0.25, Math.min(Math.PI - 0.25, targetSpherical.phi - dy * 0.0085));
      });
      domEl.addEventListener('pointerup', (e) => {
        isDragging = false;
        try { domEl.releasePointerCapture(e.pointerId); } catch (_) {}
      });

      window.addEventListener('resize', () => {
        if (!container || !renderer || !camera) return;
        const nw = container.clientWidth;
        const nh = container.clientHeight;
        if (nw && nh) {
          camera.aspect = nw / nh;
          camera.updateProjectionMatrix();
          renderer.setSize(nw, nh);
        }
      });
    }

    function buildThreeCubies() {
      threeCubies = [];
      const coreGeo = new THREE.BoxGeometry(0.94, 0.94, 0.94);
      const coreMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
      const stickerGeo = new THREE.PlaneGeometry(0.84, 0.84);

      const faceDefs = [
        { face: 'R', cond: (x,y,z) => x === 1,  color: FACE_COLORS.R, pos: [0.475, 0, 0],  rot: [0, Math.PI/2, 0] },
        { face: 'L', cond: (x,y,z) => x === -1, color: FACE_COLORS.L, pos: [-0.475, 0, 0], rot: [0, -Math.PI/2, 0] },
        { face: 'U', cond: (x,y,z) => y === 1,  color: FACE_COLORS.U, pos: [0, 0.475, 0],  rot: [-Math.PI/2, 0, 0] },
        { face: 'D', cond: (x,y,z) => y === -1, color: FACE_COLORS.D, pos: [0, -0.475, 0], rot: [Math.PI/2, 0, 0] },
        { face: 'F', cond: (x,y,z) => z === 1,  color: FACE_COLORS.F, pos: [0, 0, 0.475],  rot: [0, 0, 0] },
        { face: 'B', cond: (x,y,z) => z === -1, color: FACE_COLORS.B, pos: [0, 0, -0.475], rot: [0, Math.PI, 0] }
      ];

      for (let hx = -1; hx <= 1; hx++) {
        for (let hy = -1; hy <= 1; hy++) {
          for (let hz = -1; hz <= 1; hz++) {
            const group = new THREE.Group();
            group.position.set(hx, hy, hz);
            group.add(new THREE.Mesh(coreGeo, coreMat));

            const stickerMeshes = [];
            for (const fd of faceDefs) {
              if (fd.cond(hx, hy, hz)) {
                const mat = new THREE.MeshBasicMaterial({ color: fd.color });
                const mesh = new THREE.Mesh(stickerGeo, mat);
                mesh.position.set(...fd.pos);
                mesh.rotation.set(...fd.rot);
                group.add(mesh);
                stickerMeshes.push({ face: fd.face, baseColor: fd.color, mat });
              }
            }

            cubeRootGroup.add(group);
            threeCubies.push({ home: [hx, hy, hz], group, stickerMeshes });
          }
        }
      }
    }

    function updateCameraFromSpherical(instant = false) {
      if (!camera) return;
      if (instant) {
        camSpherical.theta = targetSpherical.theta;
        camSpherical.phi = targetSpherical.phi;
        camSpherical.radius = targetSpherical.radius;
      } else {
        camSpherical.theta += (targetSpherical.theta - camSpherical.theta) * 0.15;
        camSpherical.phi += (targetSpherical.phi - camSpherical.phi) * 0.15;
        camSpherical.radius += (targetSpherical.radius - camSpherical.radius) * 0.15;
      }
      const r = camSpherical.radius;
      const sinPhi = Math.sin(camSpherical.phi);
      camera.position.x = r * sinPhi * Math.sin(camSpherical.theta);
      camera.position.y = r * Math.cos(camSpherical.phi);
      camera.position.z = r * sinPhi * Math.cos(camSpherical.theta);
      camera.lookAt(0, 0, 0);
    }

    function setCameraPreset(preset) {
      if (preset === 'FR') { targetSpherical.theta = 0.62; targetSpherical.phi = 1.08; }
      else if (preset === 'BR') { targetSpherical.theta = 2.45; targetSpherical.phi = 1.08; }
      else if (preset === 'FL') { targetSpherical.theta = -0.62; targetSpherical.phi = 1.08; }
      else if (preset === 'BL') { targetSpherical.theta = -2.45; targetSpherical.phi = 1.08; }
      else if (preset === 'BOTTOM') { targetSpherical.theta = 0.55; targetSpherical.phi = 2.45; }
      else if (preset === 'RIGHT_BOTH') { targetSpherical.theta = 1.25; targetSpherical.phi = 1.06; }
    }

    function updateThreeStickerColors() {
      for (const tc of threeCubies) {
        const fakeCubie = { home: tc.home };
        for (const sm of tc.stickerMeshes) {
          const hex = getStickerDisplayColor(
            fakeCubie,
            { color: sm.baseColor },
            appState.maskMode,
            appState.activeAlgSlot
          );
          sm.mat.color.set(hex);
        }
      }
    }

    function snapThreeCubeToStep(stepIndex) {
      if (currentTween) finishCurrentTweenInstantly();

      for (const tc of threeCubies) {
        cubeRootGroup.attach(tc.group);
        tc.group.position.set(tc.home[0], tc.home[1], tc.home[2]);
        tc.group.rotation.set(0, 0, 0);
        tc.group.updateMatrix();
      }

      const moves = appState.parsedMoves;
      // 1. Pre-orient solved cube by net center transformation of moves
      const centerMoves = getForwardCenterMoves(moves);
      for (const cm of centerMoves) {
        applyInstantMoveToThree(cm);
      }
      // 2. Apply exact inverse moves M_n^-1 ... M_1^-1 to reach S_0 (White D, Green F)
      for (let i = moves.length - 1; i >= 0; i--) {
        const inv = invertMove(moves[i]);
        applyInstantMoveToThree(inv);
      }
      // 3. Apply forward moves up to stepIndex
      for (let i = 0; i < stepIndex; i++) {
        applyInstantMoveToThree(moves[i]);
      }

      appState.currentStep = stepIndex;
      updateTimelineUI();
    }

    function applyInstantMoveToThree(move) {
      const axisIdx = move.axis;
      const angle = move.quarters * (Math.PI / 2);

      activePivotGroup.rotation.set(0, 0, 0);
      activePivotGroup.position.set(0, 0, 0);
      activePivotGroup.updateMatrixWorld();

      const affected = [];
      for (const tc of threeCubies) {
        if (move.layers.includes(Math.round(tc.group.position[axisIdx]))) {
          affected.push(tc.group);
        }
      }
      for (const g of affected) activePivotGroup.attach(g);

      activePivotGroup.rotation[axisIdx] = angle;
      activePivotGroup.updateMatrixWorld();

      for (const g of affected) {
        cubeRootGroup.attach(g);
        g.position.set(Math.round(g.position.x), Math.round(g.position.y), Math.round(g.position.z));
        g.updateMatrixWorld();
      }
      activePivotGroup.rotation.set(0, 0, 0);
    }

    function animateSingleMove(move, onComplete) {
      if (currentTween) finishCurrentTweenInstantly();

      const axisKey = move.axis;
      const targetAngle = move.quarters * (Math.PI / 2);
      const isDouble = Math.abs(move.quarters) === 2;
      const duration = (isDouble ? 340 : 230) / appState.animSpeed;

      activePivotGroup.rotation.set(0, 0, 0);
      activePivotGroup.position.set(0, 0, 0);
      activePivotGroup.updateMatrixWorld();

      const affected = [];
      for (const tc of threeCubies) {
        if (move.layers.includes(Math.round(tc.group.position[axisKey]))) {
          affected.push(tc.group);
        }
      }
      for (const g of affected) activePivotGroup.attach(g);

      currentTween = { axisKey, affected, targetAngle, elapsed: 0, duration, onComplete };
    }

    function finishCurrentTweenInstantly() {
      if (!currentTween) return;
      const tw = currentTween;
      currentTween = null;

      activePivotGroup.rotation[tw.axisKey] = tw.targetAngle;
      activePivotGroup.updateMatrixWorld();

      for (const g of tw.affected) {
        cubeRootGroup.attach(g);
        g.position.set(Math.round(g.position.x), Math.round(g.position.y), Math.round(g.position.z));
        g.updateMatrixWorld();
      }
      activePivotGroup.rotation.set(0, 0, 0);
      if (tw.onComplete) tw.onComplete();
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function mainAnimationLoop(now) {
      const dt = now - lastFrameTime;
      lastFrameTime = now;
      updateCameraFromSpherical();

      if (currentTween) {
        currentTween.elapsed += dt;
        const t = Math.min(1, currentTween.elapsed / currentTween.duration);
        activePivotGroup.rotation[currentTween.axisKey] = currentTween.targetAngle * easeInOutCubic(t);
        if (t >= 1) finishCurrentTweenInstantly();
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
      requestAnimationFrame(mainAnimationLoop);
    }

    /*************************************************************************
     * 3B. CHINESE MNEMONIC GENERATOR (口訣生成器)
     * Exact mapping requested:
     *   F = 壓, F' = 回, F2 = 壓壓
     *   U = 左, U' = 右, U2 = 左左
     *   R = 上, R' = 下, R2 = 上上
     *   L' = 上, L = 下, L2 = 下下
     *************************************************************************/
    function tokenToChineseMnemonic(rawToken) {
      const map = {
        "F":  { word: "壓", hand: "" },
        "F'": { word: "回", hand: "" },
        "F2": { word: "壓兩下", hand: "" },
        "F2'": { word: "回兩下", hand: "" },
        "U":  { word: "右", hand: "" },
        "U'": { word: "左", hand: "" },
        "U2": { word: "右右", hand: "" },
        "U2'": { word: "左左", hand: "" },
        "R":  { word: "上", hand: "右" },
        "R'": { word: "下", hand: "右" },
        "R2": { word: "上上", hand: "右" },
        "R2'": { word: "下下", hand: "右" },
        "L'": { word: "上", hand: "左" },
        "L":  { word: "下", hand: "左" },
        "L2": { word: "下下", hand: "左" },
        "L2'": { word: "上上", hand: "左" },
        "r":  { word: "右雙上", hand: "r" },
        "r'": { word: "右雙下", hand: "r'" },
        "r2": { word: "右雙上上", hand: "r2" },
        "l'": { word: "左雙上", hand: "l'" },
        "l":  { word: "左雙下", hand: "l" },
        "f":  { word: "雙層壓", hand: "f" },
        "f'": { word: "雙層回", hand: "f'" },
        "d":  { word: "底左", hand: "d" },
        "d'": { word: "底右", hand: "d'" },
        "u":  { word: "雙層左", hand: "u" },
        "u'": { word: "雙層右", hand: "u'" },
        "B":  { word: "後壓", hand: "B" },
        "B'": { word: "後回", hand: "B'" },
        "B2": { word: "後壓兩下", hand: "B2" },
        "S":  { word: "中壓", hand: "S" },
        "S'": { word: "中回", hand: "S'" },
        "M":  { word: "中下", hand: "M" },
        "M'": { word: "中上", hand: "M'" },
        "y":  { word: "轉右(y)", hand: "y" },
        "y'": { word: "轉左(y')", hand: "y'" },
        "y2": { word: "轉半圈(y2)", hand: "y2" }
      };
      return map[rawToken] || { word: rawToken, hand: "" };
    }

    function generateMnemonicHTML(algStr) {
      if (!algStr) return '';
      const expanded = expandRepeatedTriggers(algStr);
      // Detect if both L and R moves appear in the same formula so we can subtly tag Left-hand 上/下
      const hasL = /[Ll]/.test(expanded);
      const hasR = /[Rr]/.test(expanded);
      const bothHands = hasL && hasR;

      const tokenRegex = /(\(|\)|\[|\])|([RLUDFBrludfbMESxyz](?:2'|'|2)?)/g;
      const parts = [];
      let match;
      while ((match = tokenRegex.exec(expanded)) !== null) {
        if (match[1]) {
          const b = match[1];
          if (b === '(') parts.push('<span class="text-sky-400 font-normal">(</span>');
          else if (b === ')') parts.push('<span class="text-sky-400 font-normal">)</span> ');
          else if (b === '[') parts.push('<span class="text-emerald-400 font-normal">[</span>');
          else if (b === ']') parts.push('<span class="text-emerald-400 font-normal">]</span> ');
        } else if (match[2]) {
          const tok = match[2];
          const info = tokenToChineseMnemonic(tok);
          const handPrefix = (bothHands && tok.startsWith('L'))
            ? '<sub class="text-[9px] text-rose-300/90 font-normal mr-0.5">左</sub>'
            : '';
          parts.push(`<span class="inline-block mr-1">${handPrefix}${info.word}</span>`);
        }
      }
      return parts.join('').trim();
    }

    function generatePlainMnemonicText(algStr) {
      if (!algStr) return '';
      const expanded = expandRepeatedTriggers(algStr);
      const tokenRegex = /(\(|\)|\[|\])|([RLUDFBrludfbMESxyz](?:2'|'|2)?)/g;
      const out = [];
      let match;
      while ((match = tokenRegex.exec(expanded)) !== null) {
        if (match[1]) {
          out.push(match[1]);
        } else if (match[2]) {
          out.push(tokenToChineseMnemonic(match[2]).word);
        }
      }
      return out.join(' ').replace(/\(\s+/g, '(').replace(/\s+\)/g, ')').replace(/\[\s+/g, '[').replace(/\s+\]/g, ']');
    }

    function buildCustomWrongSlotAlg(targetSlot, wrongSlot, stateType) {
      if (targetSlot === wrongSlot) {
        return stateType === 'PAIR_FLIPPED'
          ? "(R U' R') U' (R U R' U') (R U R')"
          : "(R U' R' U) (R U' R')";
      }
      const extractMap = {
        FR: { solved: "(R U' R')", flipped: "(R U R')", edge: "(R U' R')", corner: "(R U R')" },
        BR: { solved: "(R' U R)",  flipped: "(R' U' R)", edge: "(R' U' R)", corner: "(R' U R)" },
        FL: { solved: "(L' U' L)", flipped: "(L' U L)",  edge: "(L' U' L)", corner: "(L' U' L)" },
        BL: { solved: "(L U L')",  flipped: "(L U' L')", edge: "(L U' L')", corner: "(L U L')" }
      };
      const insertMap = {
        FR: "U (R U' R')",
        BR: "U' (R' U R)",
        FL: "U' (L' U L)",
        BL: "U (L U' L')"
      };
      const ex = extractMap[wrongSlot] || extractMap.BR;
      const ins = insertMap[targetSlot] || insertMap.FR;
      if (stateType === 'PAIR_FLIPPED') return `${ex.flipped} U' ${ins}`;
      if (stateType === 'EDGE_ONLY') return `U' ${ex.edge} ${ins}`;
      if (stateType === 'CORNER_ONLY') return `${ex.corner} ${ins}`;
      return `${ex.solved} ${ins}`;
    }

    /*************************************************************************
     * 4. 2D ISOMETRIC CANVAS THUMBNAIL RENDERER (DYNAMIC HI-DPI SCALING)
     *************************************************************************/
    function renderCubeThumbnail(canvas, algStr, maskMode, targetSlot, caseId = 0, wrongSlot = null, customSize = 84) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const width = customSize;
      const height = customSize;
      if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
        canvas.width = width * dpr;
        canvas.height = height * dpr;
      }
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);

      const cubies = computeCaseStartLogicalCube(algStr);

      let camYaw = 0;
      const slotToView = wrongSlot || targetSlot;

      if (wrongSlot || appState.thumbCamMode === 'slot') {
        if (slotToView === 'FR') camYaw = 0;
        else if (slotToView === 'BR') camYaw = 1;
        else if (slotToView === 'BL') camYaw = 2;
        else if (slotToView === 'FL') camYaw = 3;
      } else {
        camYaw = 0;
      }

      function camToWorld(cx, cy, cz) {
        let x = cx, y = cy, z = cz;
        for (let i = 0; i < camYaw; i++) {
          const nx = z, nz = -x;
          x = nx; z = nz;
        }
        return [x, y, z];
      }

      function getStickerAtCam(camX, camY, camZ, camNormal) {
        const [wx, wy, wz] = camToWorld(camX, camY, camZ);
        const [wnx, wny, wnz] = camToWorld(camNormal[0], camNormal[1], camNormal[2]);
        const c = cubies.find(cb => cb.pos[0] === wx && cb.pos[1] === wy && cb.pos[2] === wz);
        if (!c) return FACE_COLORS.GREY;
        const st = c.stickers.find(s => s.normal[0] === wnx && s.normal[1] === wny && s.normal[2] === wnz);
        if (!st) return FACE_COLORS.GREY;
        return getStickerDisplayColor(c, st, maskMode, targetSlot);
      }

      const cx = width / 2;
      const cy = height / 2;
      const s = width * 0.132; // Scales crisply to fill ~82% of canvas
      const cos30 = Math.cos(Math.PI / 6);
      const sin30 = Math.sin(Math.PI / 6);

      function project(x, y, z) {
        return [
          cx + (x - z) * cos30 * s,
          cy + (x + z) * sin30 * s - y * s
        ];
      }

      function drawQuad(p1, p2, p3, p4, fillColor) {
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.lineTo(p3[0], p3[1]);
        ctx.lineTo(p4[0], p4[1]);
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
        ctx.lineWidth = Math.max(1.1, width * 0.015);
        ctx.strokeStyle = '#090d16';
        ctx.stroke();
      }

      const gap = 0.05;
      for (let ix = -1; ix <= 1; ix++) {
        for (let iz = -1; iz <= 1; iz++) {
          const color = getStickerAtCam(ix, 1, iz, [0, 1, 0]);
          const x0 = ix - 0.5 + gap, x1 = ix + 0.5 - gap;
          const z0 = iz - 0.5 + gap, z1 = iz + 0.5 - gap;
          drawQuad(project(x0, 1.5, z0), project(x1, 1.5, z0), project(x1, 1.5, z1), project(x0, 1.5, z1), color);
        }
      }
      for (let ix = -1; ix <= 1; ix++) {
        for (let iy = -1; iy <= 1; iy++) {
          const color = getStickerAtCam(ix, iy, 1, [0, 0, 1]);
          const x0 = ix - 0.5 + gap, x1 = ix + 0.5 - gap;
          const y0 = iy - 0.5 + gap, y1 = iy + 0.5 - gap;
          drawQuad(project(x0, y1, 1.5), project(x1, y1, 1.5), project(x1, y0, 1.5), project(x0, y0, 1.5), color);
        }
      }
      for (let iz = -1; iz <= 1; iz++) {
        for (let iy = -1; iy <= 1; iy++) {
          const color = getStickerAtCam(1, iy, iz, [1, 0, 0]);
          const z0 = iz - 0.5 + gap, z1 = iz + 0.5 - gap;
          const y0 = iy - 0.5 + gap, y1 = iy + 0.5 - gap;
          drawQuad(project(1.5, y1, z1), project(1.5, y1, z0), project(1.5, y0, z0), project(1.5, y0, z1), color);
        }
      }

      ctx.restore();
    }

    /*************************************************************************
     * 5. PLAYBACK & SELECTION LOGIC
     *************************************************************************/
    const SLOT_LABELS = {
      FR: 'FR 綠橘',
      BR: 'BR 橘藍',
      FL: 'FL 綠紅',
      BL: 'BL 藍紅'

    /**
     * Merges CubeSkills 4-Slot (#1-#41), Cube Academy Free F2L (with (setup) [insert],
     * EO, Keyhole, and Open-slot tricks), and SpeedCubeDB Advanced F2L (#42-#95)
     * into ONE unified master list `UNIFIED_F2L_CASES`.
     */
    const CA_TO_STD_MAP = {
      201: 1, 202: 2, 203: 4, 204: 3,
      205: 11, 206: 12, 207: 13, 208: 14, 209: 6, 210: 5, 211: 15, 212: 16, 213: 17, 214: 18,
      215: 25, 216: 26, 217: 27, 218: 28, 219: 30, 220: 29,
      221: 32, 222: 31, 223: 33, 224: 34, 225: 36, 226: 35,
      227: 8, 228: 7, 229: 10, 230: 9, 231: 19, 232: 20, 233: 21, 234: 22, 235: 23, 236: 24,
      237: 38, 238: 39, 239: 40, 240: 41, 241: 37
    };

    const CA_WRONG_TO_AF2L_MAP = {
      242: 127, 243: 133, 244: 130, 245: 136, 246: 133, 247: 136,
      248: 125, 249: 131, 250: 128, 251: 122, 252: 119, 253: 120,
      254: 122, 255: 123, 256: 131, 257: 132, 258: 134, 259: 135,
      260: 103, 261: 105, 262: 101, 263: 101, 264: 106, 265: 104,
      266: 111, 267: 115, 268: 107, 269: 107, 270: 117, 271: 113,
      272: 112, 273: 107, 274: 113, 275: 117, 276: 116, 277: 114
    };

    function normalizeMovesKey(algStr) {
      return parseAlg(algStr).map(m => m.raw).join(' ');
    }

    function buildUnifiedF2LDatabase() {
      const unified = [];

      // 1. Standard Cases (#1 - #41) merged with Cube Academy solutions & tags
      F2L_CASES.forEach(std => {
        const entry = {
          id: std.id,
          displayNum: `#${std.id}`,
          cat: std.cat,
          title: std.title,
          wrongRel: null,
          tags: [],
          slots: { FR: [], BR: [], FL: [], BL: [] }
        };

        ['FR', 'BR', 'FL', 'BL'].forEach(slotKey => {
          (std[slotKey] || []).forEach(algStr => {
            entry.slots[slotKey].push({ alg: algStr, badge: null });
          });
        });

        unified.push(entry);
      });

      // Merge Cube Academy #201-#241 into Standard #1-#41
      CUBE_ACADEMY_CASES.forEach(ca => {
        const targetStdId = CA_TO_STD_MAP[ca.id];
        if (!targetStdId) return;
        const entry = unified.find(u => u.id === targetStdId);
        if (!entry) return;

        (ca.tags || []).forEach(t => {
          if (!entry.tags.includes(t)) entry.tags.push(t);
        });

        (ca.algs || []).forEach(aItem => {
          const list = entry.slots[aItem.slot];
          if (!list) return;
          const normKey = normalizeMovesKey(aItem.alg);
          const existingIdx = list.findIndex(x => normalizeMovesKey(x.alg) === normKey);
          if (existingIdx !== -1) {
            // Upgrade plain notation to Cube Academy's (setup) [insert] bracketed notation & badge
            if (aItem.alg.includes('[') && !list[existingIdx].alg.includes('[')) {
              list[existingIdx].alg = aItem.alg;
            }
            if (aItem.badge && !list[existingIdx].badge) {
              list[existingIdx].badge = aItem.badge;
            }
          } else {
            list.push({ alg: aItem.alg, badge: aItem.badge || null });
          }
        });
      });

      // 2. Wrong-Slot / Advanced Cases (#42 - #95) merged from SpeedCubeDB AF2L + Cube Academy Wrong Slot
      SPEEDCUBEDB_AF2L_CASES.forEach((af, idx) => {
        const unifiedNum = 42 + idx; // #42 to #95
        const entry = {
          id: af.id, // 101 - 154
          displayNum: `#${unifiedNum}`,
          subCode: `AF2L-${af.af2lNum}`,
          cat: af.cat,
          title: af.title,
          wrongRel: af.wrongRel,
          tags: [],
          slots: { FR: [], BR: [], FL: [], BL: [] }
        };

        ['FR', 'BR', 'FL', 'BL'].forEach(slotKey => {
          (af[slotKey] || []).forEach(algStr => {
            entry.slots[slotKey].push({ alg: algStr, badge: null });
          });
        });

        unified.push(entry);
      });

      // Merge Cube Academy Wrong Slot (#242-#277) into #42-#95
      CUBE_ACADEMY_CASES.forEach(ca => {
        const targetAfId = CA_WRONG_TO_AF2L_MAP[ca.id];
        if (!targetAfId) return;
        const entry = unified.find(u => u.id === targetAfId);
        if (!entry) return;

        (ca.algs || []).forEach(aItem => {
          const list = entry.slots[aItem.slot];
          if (!list) return;
          const normKey = normalizeMovesKey(aItem.alg);
          const existingIdx = list.findIndex(x => normalizeMovesKey(x.alg) === normKey);
          if (existingIdx !== -1) {
            if (aItem.alg.includes('[') && !list[existingIdx].alg.includes('[')) {
              list[existingIdx].alg = aItem.alg;
            }
            if (aItem.badge && !list[existingIdx].badge) {
              list[existingIdx].badge = aItem.badge;
            }
          } else {
            list.push({ alg: aItem.alg, badge: aItem.badge || 'CA 實戰' });
          }
        });
      });

      return unified;
    }

    const UNIFIED_F2L_CASES = buildUnifiedF2LDatabase();

    function selectCaseAndAlg(caseId, slotKey, algStr, autoPlay = true, customMeta = null) {
      pausePlayback();

      const uCase = UNIFIED_F2L_CASES.find(c => c.id === caseId);
      const wrongSlot = (customMeta && customMeta.wrongSlot) || (uCase && uCase.wrongRel) || null;

      appState.activeCaseId = caseId;
      appState.activeAlgSlot = slotKey;
      appState.activeWrongSlot = wrongSlot;
      appState.activeAlgStr = algStr;
      appState.parsedMoves = parseAlg(algStr);
      appState.currentStep = 0;

      const slotBadge = document.getElementById('player-slot-badge');
      const wrongBadge = document.getElementById('player-wrong-slot-badge');
      const catBadge = document.getElementById('player-cat-badge');
      const titleEl = document.getElementById('player-case-title');
      const rawAlgEl = document.getElementById('raw-alg-display');
      const noteBanner = document.getElementById('alg-note-banner');

      slotBadge.textContent = SLOT_LABELS[slotKey] || slotKey;
      rawAlgEl.innerHTML = formatAlgWithBracketsHTML(algStr);

      if (wrongSlot) {
        wrongBadge.classList.remove('hidden');
        wrongBadge.textContent = `錯放: ${SLOT_LABELS[wrongSlot] || wrongSlot}`;
      } else {
        wrongBadge.classList.add('hidden');
      }

      if (customMeta && customMeta.title) {
        catBadge.textContent = customMeta.code || '自訂';
        titleEl.textContent = customMeta.title;
      } else if (uCase) {
        const catObj = F2L_CATEGORIES.find(cat => cat.id === uCase.cat);
        catBadge.textContent = uCase.subCode ? `${uCase.subCode}` : (catObj ? catObj.short : uCase.cat);
        titleEl.textContent = `${uCase.displayNum} ${uCase.title}`;
      }

      const noteText = (customMeta && customMeta.note) || (uCase && uCase.tags && uCase.tags.length ? `重點：${uCase.tags.join(' • ')}` : null);
      if (noteText) {
        noteBanner.textContent = noteText;
        noteBanner.classList.remove('hidden');
      } else {
        noteBanner.classList.add('hidden');
      }

      // Update Chinese Mnemonic Display Box
      const mnemonicPhraseEl = document.getElementById('mnemonic-phrase-display');
      const mnemonicStepsEl = document.getElementById('mnemonic-steps-detail');
      if (mnemonicPhraseEl) {
        mnemonicPhraseEl.innerHTML = generateMnemonicHTML(algStr);
      }
      if (mnemonicStepsEl) {
        mnemonicStepsEl.innerHTML = '';
        appState.parsedMoves.forEach((m, idx) => {
          const info = tokenToChineseMnemonic(m.raw);
          const badge = document.createElement('button');
          badge.className = 'px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 border border-slate-800 text-[10px] flex items-center gap-1 transition';
          badge.innerHTML = `<span class="font-mono-alg text-sky-300">${m.raw}</span><span class="text-slate-200 font-bold">${info.word}</span>`;
          badge.onclick = () => { pausePlayback(); snapThreeCubeToStep(idx + 1); };
          mnemonicStepsEl.appendChild(badge);
        });
      }

      // Smart camera orientation
      if (wrongSlot === 'BR' && slotKey === 'FR') {
        setCameraPreset('RIGHT_BOTH');
      } else if (wrongSlot) {
        setCameraPreset(wrongSlot);
      } else if (slotKey === 'FL' || slotKey === 'BL') {
        targetSpherical.theta = -0.58;
        targetSpherical.phi = 1.08;
      } else {
        targetSpherical.theta = 0.58;
        targetSpherical.phi = 1.08;
      }

      updateThreeStickerColors();
      snapThreeCubeToStep(0);
      highlightActiveCardInDOM();

      if (autoPlay) startPlayback();
    }

    function updateTimelineUI() {
      const container = document.getElementById('move-tokens-container');
      const legendBar = document.getElementById('phase-legend-bar');
      const total = appState.parsedMoves.length;
      const stepBadge = document.getElementById('step-counter-badge');
      if (stepBadge) stepBadge.textContent = `${appState.currentStep} / ${total}`;
      if (!container) return;
      container.innerHTML = '';

      const hasPhases = appState.parsedMoves.some(m => m.phase === 'setup' || m.phase === 'insert');
      if (legendBar) {
        legendBar.classList.toggle('hidden', !hasPhases);
      }

      const initBtn = document.createElement('button');
      initBtn.className = `move-pill px-1.5 py-0.5 rounded text-[11px] font-mono-alg border ${
        appState.currentStep === 0
          ? 'active-move'
          : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-600'
      }`;
      initBtn.textContent = '起點';
      initBtn.onclick = () => { pausePlayback(); snapThreeCubeToStep(0); };
      container.appendChild(initBtn);

      appState.parsedMoves.forEach((m, idx) => {
        const stepNum = idx + 1;
        const btn = document.createElement('button');
